<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Forgot Password</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #E3D5CA;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: fixed;
            width: 100%;
            overflow: hidden;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            background-color: #F5EBE1;
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(109, 93, 85, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        @media screen and (max-width: 480px) {
            body { padding: 0; background-color: #F5EBE1; align-items: flex-start; }
            .auth-card { max-width: 100%; min-height: 100vh; border-radius: 0; box-shadow: none; justify-content: center; padding-top: 60px; }
        }

        .back-btn { position: absolute; top: 30px; left: 20px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #6D5D55; font-size: 32px; text-decoration: none; }
        .title { font-size: 26px; font-weight: 700; color: #6D5D55; margin-top: 40px; margin-bottom: 40px; }
        .input-wrapper { width: 100%; background-color: #FFFFFF; border-radius: 12px; padding: 15px; display: flex; align-items: center; gap: 12px; margin-bottom: 30px; transition: all 0.3s; }
        .input-wrapper.error { border: 1px solid #ff6b6b; background-color: #fff5f5; }
        .input-wrapper i { color: #bfa093; font-size: 20px; }
        .input-wrapper input { border: none; background: transparent; width: 100%; outline: none; font-size: 16px; color: #5c4b45; }
        .submit-btn { width: 100%; padding: 16px; background-color: #D7BDB0; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(215, 189, 176, 0.5); }
    </style>
</head>
<body>
    <div class="auth-card">
        <a href="login.html" target="_top" class="back-btn"><i class='bx bx-chevron-left'></i></a>
        <div class="title">Forgot Password?</div>
        <div class="input-wrapper" id="emailWrapper">
            <i class='bx bx-envelope'></i>
            <input type="email" id="emailInput" placeholder="Gmail">
        </div>
        <button class="submit-btn" id="submitBtn">Submit</button>
    </div>

    <script src="env.js"></script>
    <script src="config.js"></script>
    <script>
        const API_BASE_URL = DB_CONFIG.apiUrl.replace(/\/$/, '');
        window.parent.postMessage('lockSwiping', '*');
        window.addEventListener('beforeunload', () => window.parent.postMessage('unlockSwiping', '*'));

        const submitBtn = document.getElementById('submitBtn');
        const emailInput = document.getElementById('emailInput');
        const emailWrapper = document.getElementById('emailWrapper');

        function validateEmail(email) {
            return String(email).toLowerCase().match(/^[^\s@]+@[^\s@]+\.[^\s@]+$/);
        }

        async function handleSubmit() {
            const email = emailInput.value.trim().toLowerCase();
            if (!email || !validateEmail(email)) {
                emailWrapper.classList.add('error');
                if (window.navigator.vibrate) window.navigator.vibrate(50);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Sending Code...";

            try {
                const response = await fetch(`${API_BASE_URL}/send_email_code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, purpose: 'reset_password' })
                });
                const data = await response.json();

                if (!response.ok) throw new Error(data.detail || '寄送驗證碼失敗');
                localStorage.setItem('temp_reset_email', email);
                localStorage.setItem('temp_verification_purpose', 'reset_password');
                if (data.code_preview) {
                    localStorage.setItem('temp_last_code_preview', data.code_preview);
                    alert(`目前是本機測試模式，驗證碼：${data.code_preview}`);
                } else {
                    localStorage.removeItem('temp_last_code_preview');
                }
                window.top.location.href = `otp_verify.html?email=${encodeURIComponent(email)}&purpose=reset_password`;
            } catch (error) {
                alert(error.message || '寄送驗證碼失敗');
                submitBtn.disabled = false;
                submitBtn.textContent = "Submit";
            }
        }

        submitBtn.addEventListener('click', handleSubmit);
        emailInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSubmit(); });
        emailInput.addEventListener('input', () => emailWrapper.classList.remove('error'));
        window.onload = () => emailInput.focus();
    </script>
</body>
</html>
