<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3ECE5">
  <title>管理員控制台 · Foodiemo</title>
  <style>
    :root{--paper:#f3ece5;--card:#fffaf5;--ink:#4d4038;--muted:#98877a;--brand:#9c7c66;--line:#e6d9cd;--danger:#a4493c;--good:#527d61;--shadow:0 10px 34px #563f2b12}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.page{max-width:1180px;margin:auto;padding:22px 18px 48px}.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}.back{border:0;border-radius:50%;width:42px;height:42px;background:var(--card);color:var(--brand);font-size:23px;box-shadow:var(--shadow)}h1{font-size:24px;margin:0}.subtitle{color:var(--muted);font-size:13px}.panel{background:var(--card);border:1px solid #eaded3;border-radius:20px;padding:18px;box-shadow:var(--shadow);margin:14px 0}.notice{padding:15px 18px;color:var(--muted)}.notice.error{color:var(--danger)}.overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px}.stat strong{display:block;font-size:25px;color:var(--brand)}.stat span{font-size:13px;color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 8px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;white-space:nowrap;color:var(--ink)}.tab.active{background:var(--brand);border-color:var(--brand);color:#fff}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar input,.toolbar select{min-height:40px;border:1px solid var(--line);border-radius:11px;background:white;padding:8px 11px;color:var(--ink)}.toolbar input[type=search]{flex:1;min-width:160px}.btn{border:0;border-radius:10px;background:var(--brand);color:#fff;padding:9px 12px;font-size:13px}.btn.secondary{background:#efe4da;color:var(--ink)}.btn.danger{background:#f4e2df;color:var(--danger)}.btn.good{background:#e1eee3;color:var(--good)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}table{border-collapse:collapse;width:100%;min-width:700px;background:#fff}th,td{padding:11px 12px;border-bottom:1px solid #f0e8e1;text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:650;background:#fcf8f4;white-space:nowrap}td{font-size:13px}tr:last-child td{border-bottom:0}.muted{color:var(--muted)}.pill{display:inline-block;border-radius:999px;background:#eee5dc;padding:3px 9px;font-size:12px;white-space:nowrap}.pill.pending,.pill.reviewing{color:#845c35;background:#f5e9d4}.pill.resolved,.pill.visible,.pill.active{color:var(--good);background:#e4efe5}.pill.hidden,.pill.dismissed,.pill.suspended{color:var(--danger);background:#f5e4e1}.actions{display:flex;gap:6px;flex-wrap:wrap}.thumbs{display:flex;gap:5px;margin-top:7px}.thumbs img{width:52px;height:52px;object-fit:cover;border-radius:8px;background:var(--paper)}.run-items{display:grid;gap:8px}.run-item{border:1px solid var(--line);border-radius:11px;padding:10px;background:#fffcf9}.run-item strong{display:block}.reason{color:var(--muted);font-size:12px;white-space:pre-wrap}.pagination{display:flex;align-items:center;justify-content:flex-end;gap:9px;padding-top:12px;color:var(--muted);font-size:13px}.empty{text-align:center;color:var(--muted);padding:32px}.hidden{display:none!important}.loading{opacity:.65;pointer-events:none}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:5;background:#4d4038;color:white;border-radius:12px;padding:10px 15px;box-shadow:var(--shadow);max-width:90vw}
    @media(max-width:650px){.page{padding:14px 12px 28px}.panel{padding:13px;border-radius:16px}.overview{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{padding:11px}.stat strong{font-size:22px}h1{font-size:21px}.top{margin-bottom:10px}.table-wrap{border:0;overflow:visible}table,tbody{display:block;min-width:0;background:transparent}thead{display:none}tr{display:block;margin:0 0 10px;border:1px solid var(--line);border-radius:13px;background:white;overflow:hidden}td{display:grid;grid-template-columns:95px minmax(0,1fr);gap:9px;padding:9px 10px}td:before{content:attr(data-label);color:var(--muted);font-size:12px}td:last-child{border-bottom:0}}
  </style>
</head>
<body>
  <main class="page" id="adminApp">
    <header class="top"><button class="back" aria-label="返回" onclick="goBack()">‹</button><div><h1>管理員控制台</h1><div class="subtitle">營運、內容審核與推薦結果檢視</div></div></header>
    <div id="gate" class="panel notice">正在驗證管理員權限…</div>
    <section id="console" class="hidden">
      <div class="panel"><div class="overview" id="overview"></div></div>
      <nav class="tabs" aria-label="管理功能">
        <button class="tab active" data-tab="users">帳號管理</button><button class="tab" data-tab="posts">貼文審核</button>
        <button class="tab" data-tab="comments">留言審核</button><button class="tab" data-tab="reports">檢舉佇列</button>
        <button class="tab" data-tab="recommendations">推薦紀錄</button><button class="tab" data-tab="audit">操作稽核</button>
      </nav>
      <section class="panel" id="workspace">
        <div class="toolbar" id="toolbar"></div><div id="content"><div class="empty">載入中…</div></div>
        <div class="pagination" id="pagination"></div>
      </section>
    </section>
  </main>
  <div id="toast" class="hidden" role="status"></div>
  <script src="env.js"></script><script src="config.js"></script>
  <script>
    const API=DB_CONFIG.apiUrl.replace(/\/$/,"");
    const state={tab:"users",offset:0,limit:25,q:"",status:"",role:"",version:"",userId:"",action:""};
    const $=s=>document.querySelector(s), esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    function goBack(){if(window.top!==window){window.top.postMessage({type:"closeFeature"},"*");return}history.back()}
    function notify(message){const toast=$("#toast");toast.textContent=message;toast.classList.remove("hidden");clearTimeout(notify.timer);notify.timer=setTimeout(()=>toast.classList.add("hidden"),2600)}
    async function api(path,options={}){const response=await fetch(API+path,{credentials:"include",cache:"no-store",...options,headers:{...(options.body?{"Content-Type":"application/json"}:{}),...(options.headers||{})}});let data={};try{data=await response.json()}catch(_){}if(!response.ok){const e=new Error(data.detail||`HTTP ${response.status}`);e.status=response.status;throw e}return data}
    function date(v){if(!v)return "—";const d=new Date(v);return Number.isNaN(+d)?esc(v):d.toLocaleString("zh-TW",{hour12:false})}
    function pill(value){return `<span class="pill ${esc(value)}">${esc(({active:"啟用",suspended:"停用",visible:"顯示",hidden:"隱藏",pending:"待處理",reviewing:"審核中",resolved:"已結案",dismissed:"已駁回"})[value]||value||"—")}</span>`}
    function stat(label,value){return `<div class="stat"><strong>${Number(value||0).toLocaleString()}</strong><span>${esc(label)}</span></div>`}
    async function loadOverview(){const d=await api("/admin/overview");$("#overview").innerHTML=[stat("註冊帳號",d.users),stat("啟用帳號",d.active_users),stat("貼文",d.posts),stat("待處理檢舉",d.open_reports),stat("留言",d.comments),stat("推薦執行次數",d.recommendation_runs),stat("近 7 日推薦",d.recommendation_runs_7d)].join("")}
    function setToolbar(){const t=$("#toolbar"),search=`<input id="q" type="search" placeholder="搜尋帳號、文字…" value="${esc(state.q)}">`;
      if(["users","posts","comments"].includes(state.tab)){const statuses=state.tab==="users"?["active","suspended"]:["visible","hidden"];t.innerHTML=search+`<select id="status"><option value="">全部狀態</option>${statuses.map(x=>`<option ${state.status===x?"selected":""} value="${x}">${x==="active"?"啟用":x==="suspended"?"停用":x==="visible"?"顯示":"隱藏"}</option>`).join("")}</select>`+(state.tab==="users"?`<select id="role"><option value="">全部角色</option><option value="user" ${state.role==="user"?"selected":""}>一般使用者</option><option value="admin" ${state.role==="admin"?"selected":""}>管理員</option></select>`:"")+`<button class="btn secondary" id="searchBtn">搜尋</button>`}
      else if(state.tab==="reports"){t.innerHTML=`<select id="status"><option value="">全部案件</option>${["pending","reviewing","resolved","dismissed"].map(x=>`<option ${state.status===x?"selected":""} value="${x}">${({pending:"待處理",reviewing:"審核中",resolved:"已結案",dismissed:"已駁回"})[x]}</option>`).join("")}</select>`}
      else if(state.tab==="recommendations"){t.innerHTML=`<input id="version" placeholder="演算法版本" value="${esc(state.version)}"><input id="userId" inputmode="numeric" placeholder="使用者 ID" value="${esc(state.userId)}"><button class="btn secondary" id="searchBtn">套用篩選</button>`}
      else {t.innerHTML=`<input id="action" placeholder="操作名稱，例如 post.hidden" value="${esc(state.action)}"><button class="btn secondary" id="searchBtn">搜尋</button>`}
      t.querySelector("#searchBtn")?.addEventListener("click",()=>{state.q=t.querySelector("#q")?.value.trim()||"";state.status=t.querySelector("#status")?.value||"";state.role=t.querySelector("#role")?.value||"";state.version=t.querySelector("#version")?.value.trim()||"";state.userId=t.querySelector("#userId")?.value.trim()||"";state.action=t.querySelector("#action")?.value.trim()||"";state.offset=0;loadTab()});
      t.querySelector("#status")?.addEventListener("change",()=>{state.status=t.querySelector("#status").value;state.offset=0;loadTab()});
    }
    function cell(label,value){return `<td data-label="${esc(label)}">${value}</td>`}
    function table(head,rows){if(!rows.length)return `<div class="empty">沒有符合條件的資料</div>`;return `<div class="table-wrap"><table><thead><tr>${head.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`}
    function pager(d){const total=d.total||0,start=total?d.offset+1:0,end=Math.min(d.offset+d.limit,total);$("#pagination").innerHTML=`<span>${start}–${end} / ${total}</span><button class="btn secondary" ${d.offset<=0?"disabled":""} id="prev">上一頁</button><button class="btn secondary" ${end>=total?"disabled":""} id="next">下一頁</button>`;$("#prev").onclick=()=>{state.offset=Math.max(0,state.offset-state.limit);loadTab()};$("#next").onclick=()=>{if(end<total){state.offset+=state.limit;loadTab()}}}
    async function loadTab(){setToolbar();const content=$("#content"),workspace=$("#workspace");workspace.classList.add("loading");content.innerHTML='<div class="empty">正在讀取…</div>';
      try{const p=new URLSearchParams({offset:state.offset,limit:state.limit});let endpoint=state.tab;
        if(["users","posts","comments"].includes(endpoint)){if(state.q)p.set("q",state.q);if(state.status)p.set("status",state.status);if(endpoint==="users"&&state.role)p.set("role",state.role)}
        if(endpoint==="reports"&&state.status)p.set("status",state.status);
        if(endpoint==="recommendations"){if(state.version)p.set("version",state.version);if(state.userId)p.set("user_id",state.userId)}
        if(endpoint==="audit"&&state.action)p.set("action",state.action);
        const d=await api(`/admin/${endpoint}?${p}`);content.innerHTML=render(endpoint,d.items||[]);if(endpoint==="recommendations")wireRuns(d.items||[]);pager(d);wireActions();
      }catch(e){content.innerHTML=`<div class="empty">讀取失敗：${esc(e.message)}</div>`}finally{workspace.classList.remove("loading")}}
    function render(tab,items){
      if(tab==="users")return table(["帳號","使用者","角色","狀態","會員","最近登入","管理"],items.map(u=>`<tr>${cell("帳號",`@${esc(u.username)}`)}${cell("使用者",esc(u.name||"—"))}${cell("角色",pill(u.role))}${cell("狀態",`${pill(u.account_status)}${u.status_reason?`<div class="reason">${esc(u.status_reason)}</div>`:""}`)}${cell("會員",u.is_premium?"會員":"一般")}${cell("最近登入",date(u.last_login_at))}${cell("管理",`<div class="actions"><button class="btn ${u.account_status==="active"?"danger":"good"}" data-action="user-status" data-id="${esc(u.id)}" data-status="${u.account_status==="active"?"suspended":"active"}">${u.account_status==="active"?"停用":"恢復"}</button><button class="btn secondary" data-action="user-role" data-id="${esc(u.id)}" data-role="${u.role==="admin"?"user":"admin"}">${u.role==="admin"?"移除管理員":"設為管理員"}</button></div>` )}</tr>`));
      if(tab==="posts")return table(["作者／內容","照片","日期","互動","狀態","處理"],items.map(p=>{const ids=Array.isArray(p.photo_ids)?p.photo_ids:[];return `<tr>${cell("作者／內容",`<strong>@${esc(p.username)}</strong><br>${esc(p.caption||"（沒有文字）")}<br><span class="muted">${esc(p.location||"")}</span>`)}${cell("照片",`<div class="thumbs">${ids.slice(0,4).map(id=>`<img loading="lazy" src="${API}/admin/photos/${encodeURIComponent(id)}" alt="貼文照片">`).join("")}</div>`)}${cell("日期",date(p.create_time))}${cell("互動",`♡ ${p.likes||0}　留言 ${p.comments||0}`)}${cell("狀態",`${pill(p.moderation_status)}${p.moderation_reason?`<div class="reason">${esc(p.moderation_reason)}</div>`:""}`)}${cell("處理",`<button class="btn ${p.moderation_status==="visible"?"danger":"good"}" data-action="post-moderation" data-id="${esc(p.id)}" data-status="${p.moderation_status==="visible"?"hidden":"visible"}">${p.moderation_status==="visible"?"隱藏貼文":"恢復顯示"}</button>`)}</tr>`}));
      if(tab==="comments")return table(["留言者","留言","貼文 ID","日期","狀態","處理"],items.map(c=>`<tr>${cell("留言者",`@${esc(c.username)}`)}${cell("留言",esc(c.text))}${cell("貼文 ID",esc(c.record_id))}${cell("日期",date(c.create_time))}${cell("狀態",pill(c.moderation_hidden?"hidden":"visible"))}${cell("處理",`<button class="btn ${c.moderation_hidden?"good":"danger"}" data-action="comment-moderation" data-id="${esc(c.id)}" data-hidden="${!c.moderation_hidden}">${c.moderation_hidden?"恢復顯示":"隱藏留言"}</button>`)}</tr>`));
      if(tab==="reports")return table(["案件","檢舉人","對象","原因／說明","建立時間","狀態","處理"],items.map(r=>{const photos=Array.isArray(r.target_photo_ids)?r.target_photo_ids:[];const actionState=r.target_type==="user"?(r.target_status==="active"?"suspended":"active"):r.target_status==="visible"?"hidden":"visible";const canModerate=!!r.target_status;return `<tr>${cell("案件",`#${esc(r.id)} · ${esc(r.target_type)} ${esc(r.target_id)}`)}${cell("檢舉人",esc(r.reporter_username||"帳號已刪除"))}${cell("對象",`${r.target_username?`<strong>@${esc(r.target_username)}</strong><br>`:""}${esc(r.target_summary||"內容已不存在")}${photos.length?`<div class="thumbs">${photos.map(id=>`<img loading="lazy" src="${API}/admin/photos/${encodeURIComponent(id)}" alt="檢舉貼文照片">`).join("")}</div>`:""}`)}${cell("原因／說明",`${esc(r.reason_code)}<br>${esc(r.details)}`)}${cell("建立時間",date(r.created_at))}${cell("狀態",pill(r.status))}${cell("處理",`<div class="actions">${canModerate?`<button class="btn ${actionState==="hidden"||actionState==="suspended"?"danger":"good"}" data-action="report-target" data-type="${esc(r.target_type)}" data-id="${esc(r.target_id)}" data-state="${esc(actionState)}">${actionState==="hidden"?"隱藏內容":actionState==="suspended"?"停用帳號":"恢復顯示"}</button>`:""}<button class="btn secondary" data-action="report-review" data-id="${esc(r.id)}" data-status="reviewing">開始審核</button><button class="btn good" data-action="report-review" data-id="${esc(r.id)}" data-status="resolved">結案</button><button class="btn danger" data-action="report-review" data-id="${esc(r.id)}" data-status="dismissed">駁回</button></div>${r.resolution_note?`<div class="reason">${esc(r.resolution_note)}</div>`:""}`)}</tr>`}));
      if(tab==="recommendations")return table(["執行時間","帳號","版本","回傳卡片數","結果與互動"],items.map((r,i)=>`<tr><td data-label="執行時間">${date(r.created_at)}</td>${cell("帳號",`@${esc(r.username)}<br><span class="muted">ID ${esc(r.user_id)}</span>`)}${cell("版本",esc(r.algorithm_version))}${cell("回傳卡片數",esc(r.candidate_count))}<td data-label="結果與互動"><button class="btn secondary" data-action="run-toggle" data-index="${i}">檢視 ${Array.isArray(r.items)?r.items.length:0} 筆結果</button><div class="run-items hidden" id="run-${i}"></div><details style="margin-top:7px"><summary class="muted">請求情境</summary><pre class="reason">${esc(JSON.stringify(r.request_context||{},null,2))}</pre></details></td></tr>`));
      return table(["時間","管理員","操作","目標","原因","請求 ID"],items.map(a=>`<tr>${cell("時間",date(a.created_at))}${cell("管理員",esc(a.actor_username||"已刪除帳號"))}${cell("操作",esc(a.action))}${cell("目標",`${esc(a.target_type)} ${esc(a.target_id||"")}`)}${cell("原因",esc(a.reason||"—"))}${cell("請求 ID",esc(a.request_id||"—"))}</tr>`));
    }
    function wireRuns(items){items.forEach((r,i)=>{const box=document.querySelector(`#run-${i}`);const btn=document.querySelector(`[data-action="run-toggle"][data-index="${i}"]`);if(!box||!btn)return;btn.onclick=()=>{box.classList.toggle("hidden");if(!box.dataset.ready){box.dataset.ready="1";const rows=Array.isArray(r.items)?r.items:[];box.innerHTML=rows.length?rows.map(item=>`<div class="run-item"><strong>#${esc(item.rank)}　${esc(item.restaurant||"店家資料已刪除")}</strong><span class="muted">曝光 ${Number(item.impressions||0)} 次 · 詳情開啟 ${Number(item.detail_opens||0)} 次 · 地圖開啟 ${Number(item.map_opens||0)} 次 · 分數：${item.score==null?"未提供":esc(item.score)}</span><div class="reason">${esc(Array.isArray(item.reasons)?item.reasons.join("、"):item.reasons||"沒有理由資料")}</div></div>`).join(""):'<div class="empty">這次執行沒有保存店家結果。</div>'}}})}
    function wireActions(){document.querySelectorAll("[data-action]").forEach(btn=>btn.addEventListener("click",async()=>{const a=btn.dataset.action,id=btn.dataset.id;
      try{if(a==="user-status"||a==="user-role"){const reason=prompt("請填寫操作原因（至少 3 個字）");if(reason===null)return;if(reason.trim().length<3){notify("操作原因至少 3 個字");return}const body=a==="user-status"?{status:btn.dataset.status,reason:reason.trim()}:{role:btn.dataset.role,reason:reason.trim()};await api(`/admin/users/${id}/${a==="user-status"?"status":"role"}`,{method:"POST",body:JSON.stringify(body)});notify("帳號設定已更新")}
      else if(a==="post-moderation"){const reason=prompt(btn.dataset.status==="hidden"?"請填寫隱藏原因":"請填寫恢復顯示原因");if(reason===null)return;if(reason.trim().length<3){notify("原因至少 3 個字");return}await api(`/admin/posts/${id}/moderation`,{method:"POST",body:JSON.stringify({status:btn.dataset.status,reason:reason.trim()})});notify("貼文審核狀態已更新")}
      else if(a==="comment-moderation"){const reason=prompt("請填寫留言處理原因");if(reason===null)return;if(reason.trim().length<3){notify("原因至少 3 個字");return}await api(`/admin/comments/${id}/moderation`,{method:"POST",body:JSON.stringify({hidden:btn.dataset.hidden==="true",reason:reason.trim()})});notify("留言審核狀態已更新")}
      else if(a==="report-review"){const status=btn.dataset.status;const note=prompt(status==="reviewing"?"審核備註（可留空）":"請填寫處理結果");if(note===null)return;if(status!=="reviewing"&&!note.trim()){notify("結案或駁回時需要填寫處理結果");return}await api(`/admin/reports/${id}/review`,{method:"POST",body:JSON.stringify({status,note:note.trim()})});notify("檢舉案件已更新")}
      else if(a==="report-target"){const type=btn.dataset.type,targetId=btn.dataset.id,next=btn.dataset.state;const reason=prompt("請填寫內容處理原因");if(reason===null)return;if(reason.trim().length<3){notify("原因至少 3 個字");return}let path,body;if(type==="user"){path=`/admin/users/${targetId}/status`;body={status:next,reason:reason.trim()}}else if(type==="record"){path=`/admin/posts/${targetId}/moderation`;body={status:next,reason:reason.trim()}}else{path=`/admin/comments/${targetId}/moderation`;body={hidden:next==="hidden",reason:reason.trim()}}await api(path,{method:"POST",body:JSON.stringify(body)});notify("檢舉對象處理完成")}
      else if(a==="run-toggle")return;
      state.offset=0;await Promise.all([loadTab(),loadOverview()]);
      }catch(e){notify(e.message)}}))}
    document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{document.querySelector(".tab.active")?.classList.remove("active");btn.classList.add("active");state.tab=btn.dataset.tab;state.offset=0;state.q="";state.status="";state.role="";loadTab()}));
    window.addEventListener("load",async()=>{try{await window.FoodiemoSessionReady;await loadOverview();$("#gate").classList.add("hidden");$("#console").classList.remove("hidden");await loadTab()}catch(e){const gate=$("#gate");gate.classList.add("error");gate.textContent=e.status===401?"登入已失效，請返回登入後再進入管理員控制台。":e.status===403?"此帳號沒有管理員權限。":`管理員資料載入失敗：${e.message}`;$("#console").classList.add("hidden")}finally{window.signalFoodiemoFeatureReady?.()}});
  </script>
</body>
</html>
