<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>聊天室</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html,body{height:100%;background:#F3ECE5;color:#59493f}body{display:flex;flex-direction:column;overflow:hidden}.header{height:92px;padding:34px 20px 0;display:flex;align-items:center;gap:12px;flex-shrink:0}.back-btn{width:44px;height:44px;border-radius:50%;background:rgba(156,124,102,.16);display:flex;align-items:center;justify-content:center;text-decoration:none}.header-copy{min-width:0;flex:1}.header-name{font-size:19px;font-weight:700;color:#6f5b50;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.header-email{font-size:12px;color:#a18e82;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.messages{flex:1;overflow-y:auto;padding:18px 18px 14px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}.message-row{display:flex;max-width:88%}.message-row.mine{align-self:flex-end;justify-content:flex-end}.bubble{padding:10px 13px;border-radius:18px;background:#fff;color:#59493f;box-shadow:0 3px 10px rgba(96,73,57,.07);font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}.mine .bubble{background:#9C7C66;color:#fff;border-bottom-right-radius:5px}.message-row:not(.mine) .bubble{border-bottom-left-radius:5px}.time{font-size:10px;color:#a18e82;align-self:flex-end;margin:0 4px}.empty{margin:auto;text-align:center;color:#a18e82;font-size:14px;padding:24px}.error{color:#a14d4d}.composer{flex-shrink:0;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:rgba(243,236,229,.96);border-top:1px solid rgba(156,124,102,.16);display:flex;gap:8px;align-items:flex-end}.composer textarea{flex:1;min-height:42px;max-height:110px;resize:none;border:0;border-radius:20px;background:#fff;padding:11px 14px;outline:0;color:#59493f;font-size:15px;line-height:1.35;box-shadow:inset 0 0 0 1px rgba(156,124,102,.1)}.composer button{width:44px;height:42px;border:0;border-radius:50%;background:#9C7C66;color:#fff;font-size:15px;font-weight:700}.composer button:disabled{background:#d8c8bc;color:#806b5d}.status{height:18px;padding:0 18px;color:#a18e82;font-size:12px;text-align:center}.typing{visibility:hidden}
</style>
</head>
<body>
<div class="header"><a href="friends.html" target="_top" class="back-btn" onclick="return returnToFriends();" aria-label="返回好友列表"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#806B5D" stroke-width="2.5" stroke-linecap="round"><path d="M15 18 9 12l6-6"/></svg></a><div class="header-copy"><div id="friendName" class="header-name">聊天室</div><div id="friendUsername" class="header-email">讀取中…</div></div></div>
<div id="messages" class="messages"><div class="empty">載入聊天內容中…</div></div>
<div id="status" class="status"></div>
<form id="composer" class="composer"><textarea id="messageInput" maxlength="2000" rows="1" placeholder="輸入訊息…" aria-label="輸入訊息"></textarea><button id="sendButton" type="submit" aria-label="送出訊息">送出</button></form>
<script src="env.js"></script><script src="config.js"></script>
<script>
function returnToFriends(){if(window.top!==window){window.top.postMessage({type:'openFeature',url:'friends.html'},'*');return false;}return true;}
window.parent.postMessage('lockSwiping','*');window.addEventListener('beforeunload',()=>{window.parent.postMessage('unlockSwiping','*');if(pollTimer)clearInterval(pollTimer);});
const API_BASE_URL=DB_CONFIG.apiUrl.replace(/\/$/,'');const params=new URLSearchParams(location.search);const friendId=Number(params.get('friend_id'));const messagesEl=document.getElementById('messages');const nameEl=document.getElementById('friendName');const usernameEl=document.getElementById('friendUsername');const input=document.getElementById('messageInput');const sendButton=document.getElementById('sendButton');const statusEl=document.getElementById('status');let currentUserId='';let lastMessageId=0;let pollTimer=null;let loading=true;
function formatTime(value){try{return new Intl.DateTimeFormat('zh-TW',{hour:'2-digit',minute:'2-digit'}).format(new Date(value));}catch(_){return '';}}
function appendMessage(message){const mine=String(message.sender_id)===String(currentUserId);const row=document.createElement('div');row.className='message-row'+(mine?' mine':'');const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=message.text;row.appendChild(bubble);const time=document.createElement('div');time.className='time';time.textContent=formatTime(message.created_at);row.appendChild(time);messagesEl.appendChild(row);lastMessageId=Math.max(lastMessageId,Number(message.id)||0);}
function renderMessages(items){messagesEl.innerHTML='';if(!items.length){messagesEl.innerHTML='<div class="empty">還沒有訊息，先打個招呼吧！</div>';return;}items.forEach(appendMessage);messagesEl.scrollTop=messagesEl.scrollHeight;}
async function loadMessages(after=0){if(!Number.isInteger(friendId)||friendId<=0){messagesEl.innerHTML='<div class="empty error">找不到聊天對象</div>';input.disabled=true;sendButton.disabled=true;return false;}const response=await fetch(API_BASE_URL+'/chats/'+friendId+'/messages?after_id='+after+'&limit=100');const data=await response.json();if(!response.ok)throw new Error(data.detail||'聊天內容讀取失敗');if(data.friend){nameEl.textContent=data.friend.name||'未命名使用者';usernameEl.textContent=data.friend.username?'@'+data.friend.username:'';}const items=data.messages||[];if(after===0)renderMessages(items);else{const hadEmpty=messagesEl.querySelector('.empty');if(hadEmpty)messagesEl.innerHTML='';items.forEach(appendMessage);if(items.length)messagesEl.scrollTop=messagesEl.scrollHeight;}return true;}
async function sendMessage(event){event.preventDefault();const text=input.value.trim();if(!text||sendButton.disabled)return;sendButton.disabled=true;statusEl.textContent='傳送中…';try{const response=await fetch(API_BASE_URL+'/chats/'+friendId+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});const data=await response.json();if(!response.ok)throw new Error(data.detail||'訊息送出失敗');input.value='';input.style.height='auto';if(data.message){if(messagesEl.querySelector('.empty'))messagesEl.innerHTML='';appendMessage(data.message);messagesEl.scrollTop=messagesEl.scrollHeight;}}catch(error){statusEl.textContent=error.message;}finally{sendButton.disabled=false;setTimeout(()=>{if(statusEl.textContent==='傳送中…')statusEl.textContent='';},1200);input.focus();}}
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,110)+'px';});document.getElementById('composer').addEventListener('submit',sendMessage);
window.addEventListener('load',async()=>{try{const me=await window.FoodiemoSessionReady;currentUserId=String(me?.id||'');await loadMessages();loading=false;pollTimer=setInterval(async()=>{try{await loadMessages(lastMessageId);}catch(error){statusEl.textContent=error.message;}},4000);}catch(error){loading=false;messagesEl.innerHTML='<div class="empty error">'+escapeHtml(error.message||'聊天內容讀取失敗')+'</div>';input.disabled=true;sendButton.disabled=true;}finally{window.signalFoodiemoFeatureReady?.();}});
</script>
</body>
</html>
