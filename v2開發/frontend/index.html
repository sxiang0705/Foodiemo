<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Memories PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Memories">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#F3ECE5">
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('🚀 PWA: Service Worker 註冊成功', reg.scope))
                    .catch(err => console.log('❌ PWA: Service Worker 註冊失敗', err));
            });
        }
    </script>
    <style>
        /* 核心殼層樣式 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #F3ECE5;
        }

        .wrapper {
            display: flex;
            width: 300vw; 
            height: 100%;
            will-change: transform;
        }

        .page {
            width: 100vw;
            height: 100%;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .drag-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 9999;
            pointer-events: none; 
            background: transparent;    
        }
    </style>
</head>
<body>
    <div class="drag-overlay" id="dragOverlay"></div>
    <div class="wrapper" id="swipeWrapper">
        <div class="page"><iframe src="memories.html"></iframe></div>
        <div class="page"><iframe src="home.html"></iframe></div>
        <div class="page"><iframe src="social.html"></iframe></div>
    </div>

    <script src="env.js"></script>
    <script src="config.js"></script> 
<script>
    // --- [0. 防止狂閃阻斷器] ---
    // Cookie identity is verified by the shared session loader in config.js.


    // --- 1. 全域變數 ---
    const swipeWrapper = document.getElementById('swipeWrapper');
    const overlay = document.getElementById('dragOverlay');
    const frames = document.querySelectorAll('iframe');

    let isScrollLocked = false; 
    let startX = 0;
    let currentX = 0;
    let startY=0, gestureAxis=null;
    let isDragging = false;
    let currentIndex = 1; // 預設 Home

    function notifyVisiblePage() {
        frames.forEach((frame, index) => {
            try {
                frame.contentWindow.postMessage({
                    type: 'pageVisibility',
                    visible: index === currentIndex,
                    pageIndex: index
                }, '*');
            } catch (error) {
                console.warn('pageVisibility postMessage failed', error);
            }
        });
    }

    // --- 2. 核心跳轉函式 ---
    function goToPage(index, animate = true) {
        if (!swipeWrapper) return;
        
        currentIndex = Math.max(0, Math.min(index, 2));
        // 強制計算目前的螢幕寬度，避免縮放導致位移錯誤
        const width = window.innerWidth;
        const offset = -currentIndex * width;
        
        swipeWrapper.style.transition = animate ? 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)' : 'none';
        swipeWrapper.style.transform = `translateX(${offset}px)`;
        
        console.log(`📍 目前頁面索引: ${currentIndex}, 位移: ${offset}px`);

        // 滑動結束後的點擊保護清空
        setTimeout(() => {
            if (!isDragging) overlay.style.pointerEvents = 'none';
        }, 450);

        notifyVisiblePage();
    }

    // --- 3. 觸摸事件攔截與處理 ---
    window.addEventListener('touchstart', (e) => {
        if (isScrollLocked) return;
        if (e.touches.length !== 1) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        gestureAxis=null;
        isDragging = true;

    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
        if (!isDragging || isScrollLocked) return;
        
        currentX = e.touches[0].clientX;
        const diff = currentX - startX;
        const dy=e.touches[0].clientY-startY;
        if (!gestureAxis) {
            if (Math.max(Math.abs(diff),Math.abs(dy))<12) return;
            gestureAxis=Math.abs(diff)>Math.abs(dy)*1.4?'horizontal':'vertical';
        }
        if (gestureAxis!=='horizontal') return;
        swipeWrapper.style.transition='none';
        overlay.style.pointerEvents='none';
        const baseOffset = -currentIndex * window.innerWidth;
        
        let moveX = baseOffset + diff;

        // 第一頁與最後一頁的阻力感
        if ((currentIndex === 0 && diff > 0) || (currentIndex === 2 && diff < 0)) {
            moveX = baseOffset + diff * 0.3;
        }
        
        swipeWrapper.style.transform = `translateX(${moveX}px)`;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
        if (!isDragging || isScrollLocked) return;
        isDragging = false;
        
        overlay.style.pointerEvents='none';
        if (gestureAxis!=='horizontal') return;
        const diff = e.changedTouches[0].clientX - startX;
        const threshold = window.innerWidth / 5; // 提高靈敏度，1/5 螢幕就翻頁

        if (Math.abs(diff) > threshold) {
            if (diff > 0 && currentIndex > 0) currentIndex--;
            else if (diff < 0 && currentIndex < 2) currentIndex++;
        }
        
        goToPage(currentIndex);
    });

    window.addEventListener('touchcancel',()=>{
        const moved=gestureAxis==='horizontal';isDragging=false;gestureAxis=null;
        overlay.style.pointerEvents='none';if(moved)goToPage(currentIndex,false);
    });

    // --- 4. 初始化邏輯 ---
    function bootApp() {
        const params = new URLSearchParams(window.location.search);
        const tab = params.get('tab');
        
        if (tab === 'memories') currentIndex = 0;
        else if (tab === 'social') currentIndex = 2;
        else currentIndex = 1;

        // 確保在渲染的第一時間就定位到 Home
        goToPage(currentIndex, false);
    }

    // 監聽訊息
    window.addEventListener('message', (e) => {
        if (e.data === 'lockSwiping') isScrollLocked = true;
        if (e.data === 'unlockSwiping') isScrollLocked = false;
    });

    // 頁面加載完成後啟動
    document.addEventListener('DOMContentLoaded', bootApp);
    // A history return may restore this shell from Safari BFCache without a load event.
    // Re-announce the visible frame so it can refresh quietly after a completed edit.
    window.addEventListener('pageshow', () => notifyVisiblePage());

    // 視窗大小改變時重新校準（防止旋轉手機後跑位）
    let lastViewportWidth=window.innerWidth;
    window.addEventListener('resize', () => {
        if(window.innerWidth===lastViewportWidth)return; // Safari toolbar height changes are not page rotation.
        lastViewportWidth=window.innerWidth;goToPage(currentIndex,false);
    });

    // 處理 iframe 內部手勢穿透
    window.onload = () => {
        frames.forEach(frame => {
            const win = frame.contentWindow;
            ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(type => {
                win.addEventListener(type, (e) => {
                    // Keep native taps on links/buttons inside the iframe unobstructed.
                    if (e.target.closest?.('a, button, input, textarea, select, [role=button], .shutter-btn')) return;
                    if (isScrollLocked) return;
                    // Convert moving iframe coordinates to the stationary outer viewport.
                    const rect=frame.getBoundingClientRect();
                    const normalize=list=>Array.from(list,t=>({clientX:t.clientX+rect.left,clientY:t.clientY+rect.top}));
                    const clonedEvent = new Event(type);
                    Object.defineProperties(clonedEvent, {
                        touches:{value:normalize(e.touches)},
                        changedTouches:{value:normalize(e.changedTouches)}
                    });
                    window.dispatchEvent(clonedEvent);


                    if (type === 'touchend') overlay.style.pointerEvents = 'none';
                }, { passive: true });
            });
        });
    };
</script>
  
</body>
</html>
