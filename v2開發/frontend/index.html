<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Memories PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Memories">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="theme-color" content="#F3ECE5">
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('🚀 PWA: Service Worker 註冊成功', reg.scope))
                    .catch(err => console.log('❌ PWA: Service Worker 註冊失敗', err));
            });
        }
    </script>
    <style>
        /* 核心殼層樣式 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #F3ECE5;
        }

        .wrapper {
            display: flex;
            width: 300vw; 
            height: 100%;
            will-change: transform;
        }

        .page {
            width: 100vw;
            height: 100%;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .drag-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 9999;
            pointer-events: none; 
            background: transparent;    
        }
    </style>
</head>
<body>
    <div id="shellLoading" role="status" aria-live="polite" style="display:flex;position:fixed;inset:0;z-index:11000;align-items:center;justify-content:center;gap:12px;background:#F3ECE5;color:#6F5B50;font:600 16px system-ui,sans-serif;transition:opacity .16s ease;">
        <span class="shell-spinner" aria-hidden="true"></span><span id="shellLoadingText">載入中…</span>
    </div>    <div class="drag-overlay" id="dragOverlay"></div>
    <div class="wrapper" id="swipeWrapper" style="visibility:hidden;">
        <div class="page"><iframe src="memories.html"></iframe></div>
        <div class="page"><iframe src="home.html"></iframe></div>
        <div class="page"><iframe src="social.html"></iframe></div>
    </div>
    <div id="featureOverlay" aria-hidden="true" style="display:none;position:fixed;inset:0;z-index:10000;background:#F3ECE5;">
        <iframe id="featureFrame" title="Foodiemo 功能頁面" allow="camera; microphone" style="width:100%;height:100%;border:0;display:block;background:#F3ECE5;"></iframe>
    </div>

    <script src="env.js"></script>
    <script src="config.js"></script> 
<script>
    // Feature pages are opened above this shell so the Home iframe (and its
    // camera stream) stays mounted while the user visits another section.
    (() => {
        const style = document.createElement('style');
        style.textContent = `
            #featureOverlay.comment-feature { background:rgba(32,24,20,.34)!important; }
            #featureOverlay.comment-feature #featureFrame { background:transparent!important; }
            #shellLoading .shell-spinner { width:24px; height:24px; border:3px solid rgba(156,124,102,.24); border-top-color:#9C7C66; border-radius:50%; animation:foodiemoShellSpin .72s linear infinite; flex:none; }
            #shellLoading.is-feature-loading { z-index:11001; }
            #featureFrame.feature-loading { visibility:hidden; }
            @keyframes foodiemoShellSpin { to { transform:rotate(360deg); } }
        `;
        document.head.appendChild(style);
    })();

    // --- [0. 防止狂閃阻斷器] ---
    // Cookie identity is verified by the shared session loader in config.js.


    // --- 1. 全域變數 ---
    const swipeWrapper = document.getElementById('swipeWrapper');
    const overlay = document.getElementById('dragOverlay');
    const frames = document.querySelectorAll('.wrapper iframe');
    const featureOverlay = document.getElementById('featureOverlay');
    const featureFrame = document.getElementById('featureFrame');
    const shellLoading = document.getElementById('shellLoading');
    const shellLoadingText = document.getElementById('shellLoadingText');
    let shellAuthenticated = false;
    let shellReady = false;
    let shellFallbackTimer = null;
    const readyFrames = new Set();
    const requiredFrameIndexes = [0, 1, 2];
    let featureLoadedUrl = '';
    let featureReadyUrl = '';
    let featureReadyTimer = null;
    let featureTransitionId = 0;

    function setLoadingText(text) {
        if (shellLoadingText) shellLoadingText.textContent = text;
    }

    function showShellLoading(text='載入中…', feature=false) {
        if (!shellLoading) return;
        setLoadingText(text);
        shellLoading.classList.toggle('is-feature-loading', feature);
        shellLoading.style.display = 'flex';
        shellLoading.style.opacity = '1';
    }

    function hideShellLoading() {
        if (!shellLoading) return;
        shellLoading.style.opacity = '0';
        shellLoading.classList.remove('is-feature-loading');
        setTimeout(() => {
            if (shellLoading.style.opacity === '0') shellLoading.style.display = 'none';
        }, 180);
    }

    function revealShell(force=false) {
        if (!shellLoading || (shellReady && !force)) return;
        if (!force && (!shellAuthenticated || !requiredFrameIndexes.every(index => readyFrames.has(index)))) return;
        shellReady = true;
        if (shellFallbackTimer) clearTimeout(shellFallbackTimer);
        try { sessionStorage.removeItem('foodiemo-await-shell'); } catch(e) {}
        if (swipeWrapper) swipeWrapper.style.visibility = 'visible';
        hideShellLoading();
    }

    function registerFrameReady(index) {
        readyFrames.add(Number(index));
        revealShell();
    }

    function maybeRevealFeature() {
        if (!featureOverlay || !featureFrame || !featureLoadedUrl || featureReadyUrl !== featureLoadedUrl) return;
        if (featureReadyTimer) clearTimeout(featureReadyTimer);
        featureFrame.classList.remove('feature-loading');
        featureOverlay.style.visibility = 'visible';
        hideShellLoading();
    }

    function markFeatureReady() {
        featureReadyUrl = featureFrame?.src || '';
        maybeRevealFeature();
    }
    let isScrollLocked = false; 
    let startX = 0;
    let currentX = 0;
    let startY=0, gestureAxis=null;
    let isDragging = false;
    let currentIndex = 1; // 預設 Home
    let featureHistoryActive = false;

    function featureUrl(value) {
        try {
            const url = new URL(value, location.href);
            if (url.origin !== location.origin || !/^\/(?:search|edit|profile|message|comments|friends|payment|chat)\.html$/.test(url.pathname)) return null;
            return url.href;
        } catch (_) { return null; }
    }

    function showFeaturePage(value, updateHistory=true) {
        const url = featureUrl(value);
        if (!url || !featureOverlay || !featureFrame) return;
        const transitionId = ++featureTransitionId;
        if (featureReadyTimer) clearTimeout(featureReadyTimer);
        if (updateHistory) {
            history.pushState({ feature: url }, '', url);
            featureHistoryActive = true;
        }
        const isCommentFeature = new URL(url).pathname.endsWith('/comments.html');
        const cachedFeature = featureFrame.src === url && featureReadyUrl === url;
        featureOverlay.classList.toggle('comment-feature', isCommentFeature);
        featureFrame.style.background = isCommentFeature ? 'transparent' : '#F3ECE5';
        featureOverlay.style.display = 'block';
        featureOverlay.style.visibility = (cachedFeature || isCommentFeature) ? 'visible' : 'hidden';
        featureOverlay.setAttribute('aria-hidden', 'false');
        featureFrame.classList.toggle('feature-loading', !cachedFeature && !isCommentFeature);
        isScrollLocked = true;
        if (cachedFeature) {
            featureLoadedUrl = url;
            markFeatureReady();
            return;
        }
        featureLoadedUrl = '';
        featureReadyUrl = '';
        if (isCommentFeature) {
            hideShellLoading();
        } else {
            showShellLoading('頁面載入中…', true);
        }
        featureFrame.onload = () => {
            // A fast open-close-open sequence can deliver an old iframe load
            // after a newer navigation. Only the latest transition may reveal it.
            if (transitionId !== featureTransitionId || featureFrame.src !== url) return;
            featureLoadedUrl = featureFrame.src;
            maybeRevealFeature();
        };
        featureFrame.src = url;
        featureReadyTimer = setTimeout(() => {
            // API 失敗時仍讓錯誤畫面可見，不把使用者鎖在遮罩裡。
            if (transitionId === featureTransitionId && featureFrame.src === url) {
                featureFrame.classList.remove('feature-loading');
                featureOverlay.style.visibility = 'visible';
                hideShellLoading();
            }
        }, 10000);
    }

    function shellHistoryUrl() {
        const base = new URL('index.html', location.href);
        base.search = currentIndex === 0 ? '?tab=memories' : currentIndex === 2 ? '?tab=social' : '';
        base.hash = '';
        return base.pathname + base.search;
    }

    function closeFeaturePage(restoreHistory=true) {
        const hadHistory = featureHistoryActive;
        ++featureTransitionId;
        featureHistoryActive = false;
        if (featureReadyTimer) clearTimeout(featureReadyTimer);
        if (featureFrame) featureFrame.classList.add('feature-loading');
        if (featureOverlay) {
            featureOverlay.classList.remove('comment-feature');
            featureOverlay.style.display = 'none';
            featureOverlay.setAttribute('aria-hidden', 'true');
        }
        if (featureFrame) featureFrame.style.background = '#F3ECE5';
        if (featureOverlay) featureOverlay.style.visibility = 'visible';
        hideShellLoading();
        isScrollLocked = false;
        notifyVisiblePage();
        if (restoreHistory && hadHistory) {
            const closeTransitionId = featureTransitionId;
            history.back();
            // History traversal is asynchronous. If Safari/Chromium leaves the
            // feature URL in place after the overlay is already closed, restore
            // the shell URL without disturbing a nested feature that reopened.
            setTimeout(() => {
                if (closeTransitionId !== featureTransitionId || featureOverlay?.style.display === 'block') return;
                if (featureUrl(location.href)) history.replaceState(null, '', shellHistoryUrl());
            }, 600);
        }
    }
    function notifyVisiblePage() {
        frames.forEach((frame, index) => {
            try {
                frame.contentWindow.postMessage({
                    type: 'pageVisibility',
                    visible: index === currentIndex,
                    pageIndex: index
                }, '*');
            } catch (error) {
                console.warn('pageVisibility postMessage failed', error);
            }
        });
    }

    // --- 2. 核心跳轉函式 ---
    function goToPage(index, animate = true) {
        if (!swipeWrapper) return;
        
        currentIndex = Math.max(0, Math.min(index, 2));
        // 強制計算目前的螢幕寬度，避免縮放導致位移錯誤
        const width = window.innerWidth;
        const offset = -currentIndex * width;
        
        swipeWrapper.style.transition = animate ? 'transform 0.4s cubic-bezier(0.25, 1, 0.5, 1)' : 'none';
        swipeWrapper.style.transform = `translateX(${offset}px)`;
        
        console.log(`📍 目前頁面索引: ${currentIndex}, 位移: ${offset}px`);

        // 滑動結束後的點擊保護清空
        setTimeout(() => {
            if (!isDragging) overlay.style.pointerEvents = 'none';
        }, 450);

        notifyVisiblePage();
    }

    // --- 3. 觸摸／滑鼠拖曳事件攔截與處理 ---
    function beginHorizontalGesture(clientX, clientY) {
        if (isScrollLocked) return;
        startX = clientX;
        startY = clientY;
        currentX = clientX;
        gestureAxis = null;
        isDragging = true;
    }

    function moveHorizontalGesture(clientX, clientY) {
        if (!isDragging || isScrollLocked) return;
        currentX = clientX;
        const diff = currentX - startX;
        const dy = clientY - startY;
        if (!gestureAxis) {
            if (Math.max(Math.abs(diff), Math.abs(dy)) < 12) return;
            gestureAxis = Math.abs(diff) > Math.abs(dy) * 1.4 ? 'horizontal' : 'vertical';
        }
        if (gestureAxis !== 'horizontal') return;
        swipeWrapper.style.transition = 'none';
        overlay.style.pointerEvents = 'none';
        const baseOffset = -currentIndex * window.innerWidth;
        let moveX = baseOffset + diff;
        if ((currentIndex === 0 && diff > 0) || (currentIndex === 2 && diff < 0)) moveX = baseOffset + diff * 0.3;
        swipeWrapper.style.transform = `translateX(${moveX}px)`;
    }

    function endHorizontalGesture(clientX) {
        if (!isDragging || isScrollLocked) return;
        isDragging = false;
        overlay.style.pointerEvents = 'none';
        if (gestureAxis !== 'horizontal') { gestureAxis = null; return; }
        const diff = clientX - startX;
        const threshold = window.innerWidth / 5;
        if (Math.abs(diff) > threshold) {
            if (diff > 0 && currentIndex > 0) currentIndex--;
            else if (diff < 0 && currentIndex < 2) currentIndex++;
        }
        gestureAxis = null;
        goToPage(currentIndex);
    }

    function cancelHorizontalGesture() {
        const moved = gestureAxis === 'horizontal';
        isDragging = false;
        gestureAxis = null;
        overlay.style.pointerEvents = 'none';
        if (moved) goToPage(currentIndex, false);
    }

    window.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        beginHorizontalGesture(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
        if (e.touches.length !== 1) return;
        moveHorizontalGesture(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
        const point = e.changedTouches[0];
        if (point) endHorizontalGesture(point.clientX);
    });

    window.addEventListener('touchcancel', cancelHorizontalGesture);

    // Desktop HTTPS testing uses a mouse or trackpad rather than touch events.
    window.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        beginHorizontalGesture(e.clientX, e.clientY);
    });
    window.addEventListener('mousemove', (e) => moveHorizontalGesture(e.clientX, e.clientY));
    window.addEventListener('mouseup', (e) => endHorizontalGesture(e.clientX));
    window.addEventListener('mouseleave', cancelHorizontalGesture);

    // --- 4. 初始化邏輯 ---
    async function bootApp() {
        showShellLoading('驗證登入狀態…');
        const params = new URLSearchParams(window.location.search);
        const tab = params.get('tab');
        
        if (tab === 'memories') currentIndex = 0;
        else if (tab === 'social') currentIndex = 2;
        else currentIndex = 1;

        // 先定位但保持遮罩，避免使用者看到尚未完成的頁面。
        goToPage(currentIndex, false);
        try {
            const user = await window.FoodiemoSessionReady;
            if (!user) {
                FoodiemoViewCache.clear();
                window.top.location.replace('login.html');
                return;
            }
            shellAuthenticated = true;
            revealShell();
            shellFallbackTimer = setTimeout(() => {
                if (!shellReady) {
                    setLoadingText('資料載入時間較久，剩餘內容會在背景更新');
                    revealShell(true);
                }
            }, 15000);
        } catch (_) {
            FoodiemoViewCache.clear();
            window.top.location.replace('login.html');
        }
    }
    // 監聽訊息
    window.addEventListener('message', (e) => {
        if (e.data === 'lockSwiping') isScrollLocked = true;
        if (e.data === 'unlockSwiping') isScrollLocked = false;
        if (e.data?.type === 'openFeature' &&
            (e.source === frames[1]?.contentWindow || e.source === frames[2]?.contentWindow || e.source === featureFrame?.contentWindow)) {
            showFeaturePage(e.data.url);
            return;
        }
        if (e.data?.type === 'closeFeature' && e.source === featureFrame?.contentWindow) {
            closeFeaturePage();
            return;
        }
        if (e.data?.type === 'featureReady' && e.source === featureFrame?.contentWindow) {
            markFeatureReady();
            return;
        }
        if (e.data?.type === 'frameReady') registerFrameReady(e.data.pageIndex);
    });
    window.addEventListener('popstate', event => {
        if (event.state?.feature) showFeaturePage(event.state.feature, false);
        else if (featureOverlay?.style.display === 'block') closeFeaturePage(false);
    });

    // 頁面加載完成後啟動
    document.addEventListener('DOMContentLoaded', bootApp);
    // A history return may restore this shell from Safari BFCache without a load event.
    // Re-announce the visible frame so it can refresh quietly after a completed edit.
    window.addEventListener('pageshow', () => notifyVisiblePage());

    // 視窗大小改變時重新校準（防止旋轉手機後跑位）
    let lastViewportWidth=window.innerWidth;
    window.addEventListener('resize', () => {
        if(window.innerWidth===lastViewportWidth)return; // Safari toolbar height changes are not page rotation.
        lastViewportWidth=window.innerWidth;goToPage(currentIndex,false);
    });

    // 處理 iframe 內部手勢穿透
    window.onload = () => {
        frames.forEach(frame => {
            const win = frame.contentWindow;
            ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(type => {
                win.addEventListener(type, (e) => {
                    // Keep native taps on links/buttons inside the iframe unobstructed.
                    if (e.target.closest?.('a, button, input, textarea, select, [role=button], .shutter-btn')) return;
                    if (isScrollLocked) return;
                    const rect=frame.getBoundingClientRect();
                    const normalize=list=>Array.from(list,t=>({clientX:t.clientX+rect.left,clientY:t.clientY+rect.top}));
                    const clonedEvent = new Event(type);
                    Object.defineProperties(clonedEvent, {
                        touches:{value:normalize(e.touches)},
                        changedTouches:{value:normalize(e.changedTouches)}
                    });
                    window.dispatchEvent(clonedEvent);
                    if (type === 'touchend') overlay.style.pointerEvents = 'none';
                }, { passive: true });
            });
            ['mousedown', 'mousemove', 'mouseup', 'mouseleave'].forEach(type => {
                win.addEventListener(type, (e) => {
                    // A desktop click on a control belongs to the iframe, not navigation.
                    if (type === 'mousedown' && e.target.closest?.('a, button, input, textarea, select, [role=button], .shutter-btn')) return;
                    if (isScrollLocked) return;
                    const rect = frame.getBoundingClientRect();
                    const clientX = e.clientX + rect.left;
                    const clientY = e.clientY + rect.top;
                    if (type === 'mousedown') window.dispatchEvent(new MouseEvent(type, {clientX, clientY, button:e.button}));
                    else if (type === 'mouseleave') window.dispatchEvent(new MouseEvent(type, {clientX, clientY}));
                    else window.dispatchEvent(new MouseEvent(type, {clientX, clientY, button:e.button}));
                }, { passive: true });
            });
        });
        // All frames have loaded, so the active frame can start camera/data preparation.
        notifyVisiblePage();
    };
</script>
  
</body>
</html>
