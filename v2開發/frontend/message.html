<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notifications</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #F3ECE5; /* 米色背景 */
            min-height: 100vh;
            color: #8C7B6D;
            height: 100vh;
            overflow-y: auto; /* 允許列表垂直滾動 */
            -webkit-overflow-scrolling: touch; /* 讓 iOS 滾動更滑順 */
            position: fixed; /* 防止橡皮筋效應干擾外殼 */
            width: 100%;
        }

        /* ----- 頂部區域 (Top Bar) ----- */
        .header {
            padding: 40px 24px 10px 24px;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            background-color: #F3ECE5; /* 確保滑動時背景不透明 */
            z-index: 100;
        }

        /* 返回按鈕 */
        .back-btn {
            width: 44px;
            height: 44px;
            background-color: rgba(156, 124, 102, 0.15); /* 淺淺的棕色底 */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
            color: #fff; /* 箭頭顏色，若覺得太亮可改 #8C7B6D */
        }

        /* ----- 通知列表容器 ----- */
        .notification-list {
            padding: 10px 0 40px 0;
        }

        /* 單個通知項目 */
        .notif-item {
            display: flex;
            padding: 16px 24px;
            border-bottom: 1px solid rgba(140, 123, 109, 0.05); /* 極淡的分隔線 */
            align-items: flex-start;
        }

        /* 左側頭像區 */
        .avatar-area {
            min-width: 50px;
            margin-right: 12px;
            position: relative;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #F3ECE5; /* 邊框用背景色，製造重疊時的切割感 */
        }

        /* 堆疊頭像樣式 (多人按讚) */
        .stacked-avatars {
            display: flex;
            width: 60px; /* 預留空間給兩個頭像 */
        }
        .stacked-avatars .avatar:nth-child(2) {
            margin-left: -20px; /* 讓第二張疊在第一張上面 */
            z-index: 2;
        }

        /* 中間文字區 */
        .text-area {
            flex: 1;
            font-size: 14px;
            line-height: 1.4;
            padding-right: 10px;
        }

        .username {
            font-weight: 700;
            color: #6D5D50; /* 深棕色名字 */
        }

        .action-text {
            color: #8C7B6D;
        }

        .time {
            color: #B0A093;
            margin-left: 4px;
        }

        /* 右側內容區 (單張圖 或 圖片網格) */
        .media-area {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* 單張預覽圖 (在右側) */
        .preview-img-right {
            width: 44px;
            height: 44px;
            border-radius: 6px;
            object-fit: cover;
        }

        /* 下方圖片網格 (Liked 8 posts) */
        .grid-gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 8px;
        }
        
        .grid-img {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 4px;
        }

    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" target="_top" class="back-btn" onclick="if (closeEmbeddedFeature()) return false;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15 18l-6-6 6-6"/>
            </svg>
        </a>
    </div>

    <div id="friendRequestNotifications" class="notification-list" style="padding-top:0;"></div>

    <div id="emptyNotifications" style="padding:48px 24px;text-align:center;color:#B0A093;font-size:14px;">目前沒有新的消息</div>

    <script src="env.js"></script><script src="config.js"></script>
    <script>
    const FRIENDS_API = DB_CONFIG.apiUrl.replace(/\/$/, '');
    const friendRequestNotifications = document.getElementById('friendRequestNotifications');
    const emptyNotifications = document.getElementById('emptyNotifications');
    function renderFriendRequests(items) {
        if (!friendRequestNotifications) return;
        if (!items.length) { friendRequestNotifications.innerHTML = ''; if (emptyNotifications) emptyNotifications.style.display = 'block'; return; }
        if (emptyNotifications) emptyNotifications.style.display = 'none';
        friendRequestNotifications.innerHTML = '<div style="padding:12px 24px 4px;font-size:16px;font-weight:700;color:#6D5D50;">好友請求</div>' + items.map(item => `
            <div class="notif-item" data-request-id="${escapeHtml(item.request_id)}">
                <div class="avatar-area"><img src="${escapeHtml(normalizeAvatarUrl(item.avatar_url || window.DEFAULT_AVATAR_URL))}" class="avatar" alt="" onerror="this.src=window.DEFAULT_AVATAR_URL"></div>
                <div class="text-area"><span class="username">${escapeHtml(item.name || '使用者')}</span><span class="action-text"> 想和你成為好友</span><span class="time">${new Date(item.created_at).toLocaleString()}</span></div>
                <div style="display:flex;flex-direction:column;gap:6px;align-items:stretch;"><button type="button" data-action="approve" style="border:0;border-radius:14px;background:#9C7C66;color:#fff;padding:7px 10px;font-weight:700;white-space:nowrap;">批准</button><button type="button" data-action="reject" style="border:0;border-radius:14px;background:rgba(156,124,102,.14);color:#806B5D;padding:7px 10px;font-weight:700;white-space:nowrap;">忽略</button></div>
            </div>`).join('');
        friendRequestNotifications.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click', () => handleFriendRequest(button)));
    }
    async function loadFriendRequests() {
        try { const response = await fetch(FRIENDS_API + '/friends'); if (!response.ok) return; const data = await response.json(); renderFriendRequests(data.incoming || []); } catch (_) {}
    }
    async function handleFriendRequest(button) {
        const row=button.closest('[data-request-id]'); if(!row)return; const id=row.dataset.requestId; const action=button.dataset.action; row.querySelectorAll('button').forEach(item=>item.disabled=true);
        try { const response=await fetch(FRIENDS_API + '/friends/requests/' + encodeURIComponent(id) + '/' + (action==='approve'?'approve':'reject'),{method:'POST'}); if(!response.ok){const data=await response.json().catch(()=>({}));throw new Error(data.detail||'好友請求處理失敗');} await loadFriendRequests(); } catch(error){alert(error.message);row.querySelectorAll('button').forEach(item=>item.disabled=false);}
    }
    window.addEventListener('load',async()=>{try{await window.FoodiemoSessionReady;await loadFriendRequests();}finally{window.signalFoodiemoFeatureReady?.();}});

    function closeEmbeddedFeature() {
        try {
            const feature = window.top.document.getElementById('featureFrame');
            if (feature && feature.contentWindow === window) {
                window.top.postMessage({type:'closeFeature'}, '*');
                return true;
            }
        } catch (_) {}
        return false;
    }

    // 1. 進入頁面時鎖定殼層滑動
    window.parent.postMessage('lockSwiping', '*');

    // 2. 離開頁面準備跳轉或返回前解鎖
    window.addEventListener('beforeunload', () => {
        window.parent.postMessage('unlockSwiping', '*');
    });

    // 3. 處理返回按鈕 (如果不想用 <a> 標籤跳轉)
    function goBack() {
        // 先手動通知解鎖，增加反應速度
        window.parent.postMessage('unlockSwiping', '*');
        // 回到主殼層
        window.top.location.href = 'index.html'; 
    }
</script>
</body>
</html>
