<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Enter OTP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg-color: #F2EBE0;
            --text-dark: #6D5D55;
            --btn-color: #C4B5A8;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        #real-input {
            position: absolute;
            opacity: 0;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            border: none;
        }

        .content {
            width: 100%;
            max-width: 375px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 25px 0 25px;
        }

        .title { font-size: 28px; font-weight: 700; color: var(--text-dark); margin-bottom: 10px; }
        .subtitle { font-size: 14px; color: #8D6E63; text-align: center; margin-bottom: 24px; line-height: 1.5; }
        #user-email { font-weight: 600; color: #5D4037; }
        #otp-purpose { font-weight: 600; color: #8D6E63; margin-bottom: 16px; }

        .otp-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 24px;
            gap: 15px;
        }

        .otp-box {
            flex: 1;
            height: 65px;
            border: 2px solid #A1887F;
            border-radius: 12px;
            font-size: 32px;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            background: rgba(255,255,255,0.3);
        }

        .otp-box.active {
            border-color: #5D4037;
            background-color: white;
            box-shadow: 0 0 0 4px rgba(93, 64, 55, 0.1);
        }

        .otp-box.active::after {
            content: "";
            width: 2px;
            height: 28px;
            background: #5D4037;
            animation: blink 1s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        .verify-btn {
            width: 100%;
            height: 55px;
            background-color: var(--btn-color);
            color: white;
            border: none;
            font-size: 18px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
        }

        .verify-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .hint {
            margin-top: 12px;
            color: #8D6E63;
            font-size: 13px;
            text-align: center;
        }
    </style>
</head>
<body>
    <input type="text" id="real-input" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code">

    <div class="content">
        <div class="title">Enter OTP</div>
        <div class="subtitle">
            驗證碼已寄到<br>
            <span id="user-email">user@example.com</span>
        </div>
        <div id="otp-purpose">驗證中</div>

        <div class="otp-container" id="otpDisplayArea">
            <div class="otp-box" id="box0"></div>
            <div class="otp-box" id="box1"></div>
            <div class="otp-box" id="box2"></div>
            <div class="otp-box" id="box3"></div>
        </div>

        <button class="verify-btn" id="verifyBtn" disabled>Verify</button>
        <div class="hint" id="previewHint"></div>
    </div>

    <script src="env.js"></script>
    <script src="config.js"></script>
    <script>
        window.parent.postMessage('lockSwiping', '*');
        window.addEventListener('beforeunload', () => window.parent.postMessage('unlockSwiping', '*'));

        const API_BASE_URL = DB_CONFIG.apiUrl.replace(/\/$/, '');
        const realInput = document.getElementById('real-input');
        const boxes = [
            document.getElementById('box0'),
            document.getElementById('box1'),
            document.getElementById('box2'),
            document.getElementById('box3')
        ];
        const verifyBtn = document.getElementById('verifyBtn');
        const previewHint = document.getElementById('previewHint');

        const urlParams = new URLSearchParams(window.location.search);
        const purpose = urlParams.get('purpose') || localStorage.getItem('temp_verification_purpose') || 'reset_password';
        const email = urlParams.get('email')
            || localStorage.getItem('temp_signup_email')
            || localStorage.getItem('temp_reset_email')
            || localStorage.getItem('myProfileEmail');

        document.getElementById('user-email').textContent = email || 'user@example.com';
        document.getElementById('otp-purpose').textContent = purpose === 'signup' ? '信箱註冊驗證' : '重設密碼驗證';

        if (!email) {
            alert('找不到要驗證的帳號，請重新操作。');
            window.top.location.href = 'login.html';
        }

        function paintInput(value) {
            boxes.forEach((box, i) => {
                box.textContent = value[i] || "";
                box.classList.remove('active');
            });
            if (value.length < 4) boxes[value.length].classList.add('active');
            verifyBtn.disabled = (value.length !== 4);
        }

        realInput.addEventListener('input', (e) => {
            const val = e.target.value.replace(/\D/g, '').substring(0, 4);
            e.target.value = val;
            paintInput(val);
        });

        document.getElementById('otpDisplayArea').addEventListener('click', () => realInput.focus());

        verifyBtn.addEventListener('click', async () => {
            verifyBtn.textContent = 'Verifying...';
            verifyBtn.disabled = true;

            try {
                const response = await fetch(`${API_BASE_URL}/verify_email_code`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email,
                        code: realInput.value,
                        purpose
                    })
                });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || '驗證失敗');
                }

                if (purpose === 'signup') {
                    await clearLocalAppData();
                    localStorage.setItem('myProfileEmail', data.email);
                    localStorage.setItem('myProfileName', data.name);
                    localStorage.setItem('isPremiumUser', data.is_premium.toString());
                    localStorage.removeItem('temp_signup_email');
                    localStorage.removeItem('temp_verification_purpose');
                    window.top.location.href = 'onboarding.html';
                    return;
                }

                localStorage.setItem('temp_reset_email', email);
                localStorage.setItem('password_reset_token', data.reset_token);
                window.top.location.href = `reset_password.html?email=${encodeURIComponent(email)}`;
            } catch (error) {
                alert(error.message || '驗證失敗');
                realInput.value = '';
                paintInput('');
                realInput.focus();
                verifyBtn.textContent = 'Verify';
            }
        });

        paintInput('');
        realInput.focus();

        const localPreview = localStorage.getItem('temp_last_code_preview');
        if (localPreview) previewHint.textContent = `本機測試提示：驗證碼 ${localPreview}`;
    </script>
</body>
</html>
