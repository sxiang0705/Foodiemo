<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home</title>
    <style>
        /* Global Settings */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        html, body { width: 100%; height: 100%; overflow: hidden ; background-color: #F3ECE5; }
        body { display: flex; flex-direction: column; justify-content: space-between; }

        /* Header */
        .header { flex-shrink: 0; padding: 30px 24px 5px 24px; display: flex; justify-content: space-between; align-items: center; }
        .brown-btn { background-color: #9C7C66; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .avatar-placeholder { width: 50px; height: 50px; border-radius: 50%; }
        .search-pill { height: 50px; width: 140px; border-radius: 25px; display: flex; justify-content: flex-start; align-items: center; padding-left: 15px; }
        .chat-btn { width: 50px; height: 50px; border-radius: 50%; }

        /* Main Content */
        .c{
            margin:0px 0;
        }
        
        .content { 
            flex: 1; 
            width: 100%; 
            /* 讓 Flexbox 負責置中，移除 margin */
            margin: 0; 
            padding: 20px 24px; 
            
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
        }

        .card { 
            width: 100%; 
            max-width: 500px; 
            /* 移除多餘的 margin */
            margin: 10px 0;
            
            /* 強制正方形 */
            aspect-ratio: 1 / 1; 
            
            /* --- ★★★ 簡單暴力法 ★★★ --- */
            /* 1. 容器設圓角 (雙重保險) */
            border-radius: 80px;
            
            /* 2. 背景透明，避免露出尖角 */
            background-color: transparent; 
            position: relative; 
            
            /* 3. 移除所有複雜的裁切語法，回歸最原始的設定 */
            
            transition: transform 0.2s ease; 
            cursor: grab;
        }

        .card img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
            pointer-events: none; 
            user-select: none;
            
            /* --- ★★★ 關鍵修正：直接讓圖片變圓 ★★★ --- */
            /* 直接命令圖片變成圓角，這是最不會出錯的方法 */
            border-radius: 80px; 
        }

        /* Footer */
        .footer { flex-shrink: 0; padding: 5px 40px 40px 40px; display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 600px; align-self: center; }
        .icon-brown { stroke: #9C7C66; fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        
        .shutter-btn { width: 72px; height: 72px; border-radius: 50%; border: 4px solid #9C7C66; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: transform 0.1s; }
        .shutter-btn:active { transform: scale(0.95); }
        .shutter-inner { width: 56px; height: 56px; background-color: #9C7C66; border-radius: 50%; }
        svg { display: block; }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.4); z-index: 200; display: none; justify-content: center; align-items: flex-end; opacity: 0; transition: opacity 0.3s; }
        .modal-overlay.show { display: flex; opacity: 1; }
        .action-sheet { width: 100%; max-width: 100%; margin-bottom: 0; background-color: #F3ECE5; border-top-left-radius: 24px; border-top-right-radius: 24px; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); overflow: hidden; }
        .modal-overlay.show .action-sheet { transform: translateY(0); }
        .action-btn { background-color: #F3ECE5; padding: 20px; text-align: center; font-size: 18px; font-weight: 500; color: #9C7C66; cursor: pointer; border-bottom: 1px solid rgba(156, 124, 102, 0.2); }
        .action-btn:active { background-color: #E0D5CC; }
        .action-btn.cancel { font-weight: 700; border-bottom: none; color: #8C735D; padding-bottom: calc(20px + env(safe-area-inset-bottom)); }
        
        #loading-toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); color: white; padding: 15px 25px; border-radius: 25px; font-size: 14px; z-index: 300; display: none; }
    
    </style>
</head>
<body>

    <div class="header">
        <a href="profile.html" target="_top" onclick="return openFeaturePage('profile.html')" style="text-decoration: none;"><div class="brown-btn avatar-placeholder"></div></a>
        <div class="brown-btn search-pill">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        </div>
        <a href="message.html" target="_top" onclick="return openFeaturePage('message.html')" class="brown-btn chat-btn" style="text-decoration: none;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        </a>
    </div>
    <div class="c">
        <div class="content">            <div class="card">
                <video id="cameraPreview" autoplay playsinline muted style="display:none;width:100%;height:100%;object-fit:cover;border-radius:80px;background:#DCCFC5;"></video>
                <img id="capturePreview" alt="剛拍攝的照片" style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:80px;">
                <div id="cameraPlaceholder" style="width:100%;height:100%;border-radius:80px;background:#DCCFC5;color:#806B5D;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:18px;line-height:1.5;">
                    相機預覽準備中
                    <small style="font-size:13px;margin-top:8px;opacity:.8;">請使用下方快門拍照</small>
                </div>
                <!-- Kept for upload/result compatibility; the center view is the camera preview. -->
                <img id="displayImg" alt="已上傳照片" style="display:none;">
                <div id="captureFeedback" role="status" aria-live="polite" style="display:none;position:absolute;left:50%;bottom:24px;transform:translate(-50%,8px);padding:8px 14px;border-radius:18px;background:rgba(64,48,38,.78);color:#fff;font-size:14px;white-space:nowrap;z-index:4;">照片已拍攝</div>
            </div>
        </div>
    </div>

    <div id="captureReviewBar" aria-label="拍攝結果操作" style="display:none;">
        <button type="button" id="discardCapture" class="capture-review-btn discard" aria-label="刪除照片" title="刪除照片">
            <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg>
        </button>
        <span class="capture-review-hint">保留這張照片？</span>
        <button type="button" id="keepCapture" class="capture-review-btn keep" aria-label="保留並發文" title="保留並發文">
            <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
        </button>
    </div>

    <div class="footer">
        <a href="search.html" target="_top" onclick="return openFeaturePage('search.html')" style="text-decoration: none; display: flex;"><svg class="icon-brown" width="32" height="32" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg></a>
        <div class="shutter-btn"><div class="shutter-inner"></div></div>
        <a href="edit.html?from=home" target="_top" onclick="return openFeaturePage('edit.html?from=home')" style="text-decoration: none; display: flex;"><svg class="icon-brown" width="32" height="32" viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg></a>
    </div>

    <input type="file" id="input_camera" accept="image/*" capture="environment" style="display: none;">
    <input type="file" id="input_gallery" accept="image/*" multiple style="display: none;">

    <div id="action-sheet-overlay" class="modal-overlay">
        <div class="action-sheet">
            <div class="action-btn" id="btn_camera">立即拍照</div>
            <div class="action-btn" id="btn_gallery">從相簿選擇</div>
            <div class="action-btn cancel" id="btn_cancel">取消</div>
        </div>
    </div>
    
    <script src="env.js"></script>
    <script src="config.js"></script>
    <script>
        // --- 1. 全域變數與初始化 ---
        function openFeaturePage(url){
            if(window.top !== window){
                window.top.postMessage({type:'openFeature',url},'*');
                return false;
            }
            return true;
        }
        const dbName = DB_CONFIG.name;
        const dbVersion = DB_CONFIG.version;
        const API_BASE_URL = DB_CONFIG.apiUrl.replace(/\/$/, ''); // 確保結尾沒有斜線

        const channel = new BroadcastChannel('memory_update');
        let db;

        // 2. 資料庫初始化 (IndexedDB)
        function initDB() {
            return window.FoodiemoInitDB().then(value => { db = value; return value; });
        }
        let frameReadySent=false, heroReady=false, avatarReady=false;
        function signalFrameReady(){
            if(frameReadySent || !heroReady || !avatarReady)return;
            frameReadySent=true;
            try { window.top.postMessage({type:'frameReady',pageIndex:1},'*'); } catch(e) {}
        }
        function markHeroReady(){ heroReady=true; signalFrameReady(); }
        function markAvatarReady(){ avatarReady=true; signalFrameReady(); }

        async function cacheImageData(cacheName, photoUrl, image) {
            if (!photoUrl) return;
            let absolute;
            try { absolute=new URL(photoUrl,location.href); } catch(e) { return; }
            if (absolute.origin!==location.origin) return;
            try {
                const max=640, scale=Math.min(1,max/Math.max(image.naturalWidth,image.naturalHeight));
                const canvas=document.createElement('canvas');
                canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));
                canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
                canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
                const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.72));
                if(!blob || blob.size>350000)return;
                const reader=new FileReader();
                reader.onload=()=>FoodiemoViewCache.write(cacheName,{url:absolute.href,data:reader.result});
                reader.readAsDataURL(blob);
            } catch(e) { /* a cache miss never blocks the visible image */ }
        }
        function cacheHeroImage(photoUrl,image){ return cacheImageData('hero',photoUrl,image); }

        let cameraStream=null, cameraUnavailable=false, cameraRequest=null;
        let captureReviewActive=false, pendingCapture=null, captureUploadBusy=false;
        function hasLiveCameraStream(){
            return !!cameraStream?.getTracks?.().some(track=>track.readyState==='live');
        }
        function stopCameraView(){
            if(cameraStream){cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null;}
            const video=document.getElementById('cameraPreview');
            const placeholder=document.getElementById('cameraPlaceholder');
            if(video){video.pause();video.srcObject=null;video.style.display='none';}
            if(placeholder)placeholder.style.display='flex';
        }
        async function prepareCameraView(){
            const video=document.getElementById('cameraPreview');
            const placeholder=document.getElementById('cameraPlaceholder');
            if(!video || !placeholder)return;
            if(cameraStream && !hasLiveCameraStream())cameraStream=null;
            if(cameraStream){
                if(!captureReviewActive){
                    video.srcObject=cameraStream;
                    await video.play().catch(()=>{});
                    video.style.display='block';
                    placeholder.style.display='none';
                }
                markHeroReady();
                return;
            }
            if(cameraUnavailable || !window.isSecureContext || !navigator.mediaDevices?.getUserMedia){
                placeholder.innerHTML='相機預覽不可用<small style="font-size:13px;margin-top:8px;opacity:.8;">請使用下方快門拍照</small>';
                placeholder.style.display='flex';
                markHeroReady();
                return;
            }
            // pageVisibility 與啟動流程可能同時呼叫這裡；Safari 若同時送出
            // 多個 getUserMedia，會重複跳出權限視窗。共用同一個進行中的請求。
            if(cameraRequest)return cameraRequest;
            const request=(async()=>{
                try {
                    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
                    cameraStream=stream;
                    video.srcObject=stream;
                    await video.play().catch(()=>{});
                    video.style.display='block';
                    placeholder.style.display='none';
                    markHeroReady();
                } catch(error) {
                    cameraUnavailable=true;
                    placeholder.innerHTML='相機預覽需要權限<small style="font-size:13px;margin-top:8px;opacity:.8;">請使用下方快門拍照</small>';
                    placeholder.style.display='flex';
                    markHeroReady();
                }
            })();
            cameraRequest=request;
            try { return await request; }
            finally { if(cameraRequest===request)cameraRequest=null; }
        }

        // 3. 核心功能：載入最新照片 (對接 FastAPI)
        async function loadLatestPhoto() {
            const imgElement = document.getElementById('displayImg');
            if (!imgElement) return;
            const cachedHero=FoodiemoViewCache.read('hero');
            if(cachedHero?.data){
                imgElement.src=cachedHero.data;
                imgElement.style.opacity='1';
            }

            try { await loadFoodiemoRecords(result=>{
            const posts=Array.isArray(result)?result:(result.data||[]);
            const latestPost=[...posts].sort((a,b)=>b.timestamp-a.timestamp)[0];
            // [3] 渲染大圖
            if (latestPost) {
                let photoUrl = latestPost.imageUrls ? latestPost.imageUrls[0] : (latestPost.url || latestPost.imageUrl);
                if (photoUrl) {
                    const tempImg = new Image();
                    if(imgElement.getAttribute("src")===photoUrl)return;
                    tempImg.onload = () => {
                        imgElement.src = photoUrl;
                        imgElement.style.opacity = "1";
                        cacheHeroImage(photoUrl,tempImg);
                    };
                    tempImg.src = photoUrl;
                    return;
                }
            }

            // [4] 無資料處理：顯示預設圖
            FoodiemoViewCache.remove('hero');
            imgElement.src = "https://images.unsplash.com/photo-1579954115545-a95591f28bfc?q=80&w=2070&auto=format&fit=crop";
            }); } catch(e) { imgElement.alt='照片暫時更新失敗，請稍後重試'; markHeroReady(); }
        }

        // 4. 使用者頭像載入 (整合 API 同步版)
        async function loadUserProfile() {
            const avatarDiv = document.querySelector('.avatar-placeholder');
            if (!avatarDiv) { markAvatarReady(); return; }

            const cachedAvatar=FoodiemoViewCache.read('avatar');
            if(cachedAvatar?.data){
                applyAvatarBackground(avatarDiv,cachedAvatar.data);
                markAvatarReady();
            }
            const avatarUrl = getStoredAvatarUrl();
            const avatarImage = new Image();
            avatarImage.onload = () => {
                applyAvatarBackground(avatarDiv,avatarUrl);
                markAvatarReady();
                cacheImageData('avatar',avatarUrl,avatarImage);
            };
            avatarImage.onerror = () => {
                if(!cachedAvatar?.data) applyAvatarBackground(avatarDiv,DEFAULT_AVATAR_URL);
                markAvatarReady();
            };
            avatarImage.src = avatarUrl;
        }

        // 5. 拍照與上傳邏輯
        const shutterBtn = document.querySelector('.shutter-btn');
        const actionOverlay = document.getElementById('action-sheet-overlay');
        const capturePreview = document.getElementById('capturePreview');
        const captureReviewBar = document.getElementById('captureReviewBar');
        const discardCaptureBtn = document.getElementById('discardCapture');
        const keepCaptureBtn = document.getElementById('keepCapture');
        const captureFeedback = document.getElementById('captureFeedback');

        const captureUiStyle=document.createElement('style');
        captureUiStyle.textContent='            #captureReviewBar{position:fixed;left:0;right:0;bottom:calc(72px + 45px + env(safe-area-inset-bottom));height:64px;min-height:64px;padding:4px 24px 2px;align-items:center;justify-content:center;gap:14px;background:#F3ECE5;color:#806B5D;z-index:20;pointer-events:none;}            #captureReviewBar.show{display:flex!important;}            .capture-review-btn{width:50px;height:50px;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .14s ease,opacity .14s ease,background .14s ease;box-shadow:0 3px 8px rgba(95,70,53,.16);}            .capture-review-btn:active{transform:scale(.9);}            .capture-review-btn:disabled{opacity:.45;cursor:wait;}            .capture-review-btn.discard{background:#F3ECE5;color:#9C7C66;border:2px solid #9C7C66;}            .capture-review-btn.keep{background:#9C7C66;color:#fff;border:2px solid #9C7C66;}            .capture-review-hint{min-width:108px;text-align:center;font-size:13px;color:#806B5D;font-weight:600;}            .card.capture-flash::after{content:"";position:absolute;inset:0;border-radius:80px;background:#fff;pointer-events:none;z-index:5;animation:foodieCaptureFlash .32s ease-out forwards;}            #captureFeedback.show{display:block!important;animation:foodieCaptureFeedback 1.7s ease-out forwards;}            .shutter-btn.capture-pulse{animation:foodieShutterPulse .26s ease-out;}            @keyframes foodieCaptureFlash{0%{opacity:.85}100%{opacity:0}}            @keyframes foodieCaptureFeedback{0%{opacity:0;transform:translate(-50%,8px)}15%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}            @keyframes foodieShutterPulse{0%{transform:scale(1)}45%{transform:scale(.9)}100%{transform:scale(1)}}';
        document.head.appendChild(captureUiStyle);

        async function uploadFiles(fileList, sourceInput=null) {
            actionOverlay.classList.remove('show');
            const files = Array.from(fileList || []);
            if (!files.length) return false;
            const toast = document.getElementById('loading-toast');
            if (toast) { toast.style.display = 'block'; toast.textContent = 'Uploading...'; }
            const formData = new FormData();
            const myEmail = localStorage.getItem('myProfileEmail') || '';
            try {
                for (const file of files) formData.append('files', await window.prepareFoodiemoPhoto(file));
                formData.append('email', myEmail);
                const response = await fetch(`${API_BASE_URL}/upload_memory_post`, {method:'POST',body:formData});
                const result = await response.json();
                if (result.status !== 'success') throw new Error(result.detail || '上傳失敗');
                if (toast) toast.textContent = 'Uploaded!';
                channel.postMessage({action:'updated'});
                if (sourceInput) sourceInput.value = '';
                setTimeout(async () => { await loadLatestPhoto(); if (toast) toast.style.display = 'none'; }, 1000);
                return true;
            } catch (err) {
                console.error('上傳錯誤:', err);
                alert('錯誤: ' + err.message);
                if (toast) toast.style.display = 'none';
                return false;
            }
        }

        function showCaptureFeedback(message='照片已拍攝'){
            if(captureFeedback){
                captureFeedback.textContent=message;
                captureFeedback.classList.remove('show');
                void captureFeedback.offsetWidth;
                captureFeedback.classList.add('show');
            }
            const card=document.querySelector('.card');
            if(card){
                card.classList.remove('capture-flash');
                void card.offsetWidth;
                card.classList.add('capture-flash');
            }
            if(shutterBtn){
                shutterBtn.classList.remove('capture-pulse');
                void shutterBtn.offsetWidth;
                shutterBtn.classList.add('capture-pulse');
            }
            try { navigator.vibrate?.(35); } catch(e) {}
        }

        function releasePendingCapture(){
            if(pendingCapture?.url)URL.revokeObjectURL(pendingCapture.url);
            pendingCapture=null;
        }

        function setCaptureReview(active){
            captureReviewActive=active;
            captureReviewBar?.classList.toggle('show',active);
            if(!active){
                if(capturePreview){capturePreview.pause?.();capturePreview.removeAttribute('src');capturePreview.style.display='none';}
                if(captureFeedback)captureFeedback.classList.remove('show');
            }
        }

        async function resumeCameraPreview(){
            if(!cameraStream) { await prepareCameraView(); return; }
            const video=document.getElementById('cameraPreview');
            const placeholder=document.getElementById('cameraPlaceholder');
            if(!video || !placeholder)return;
            video.srcObject=cameraStream;
            await video.play().catch(()=>{});
            video.style.display='block';
            placeholder.style.display='none';
            markHeroReady();
        }

        async function captureCameraPhoto() {
            if(captureReviewActive || captureUploadBusy)return;
            const video=document.getElementById('cameraPreview');
            if(!cameraStream || !video || video.readyState < 2 || !video.videoWidth){
                actionOverlay.classList.add('show');
                return;
            }
            const canvas=document.createElement('canvas');
            canvas.width=video.videoWidth; canvas.height=video.videoHeight;
            canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
            const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.9));
            if(!blob)return;
            releasePendingCapture();
            const file=new File([blob],'camera-'+Date.now()+'.jpg',{type:'image/jpeg'});
            pendingCapture={file,url:URL.createObjectURL(blob)};
            if(capturePreview){
                capturePreview.src=pendingCapture.url;
                capturePreview.style.display='block';
            }
            video.pause();
            video.style.display='none';
            document.getElementById('cameraPlaceholder').style.display='none';
            setCaptureReview(true);
            showCaptureFeedback('照片已拍攝，請選擇保留或刪除');
        }

        async function discardCapturedPhoto(){
            if(captureUploadBusy)return;
            releasePendingCapture();
            setCaptureReview(false);
            await resumeCameraPreview();
        }

        async function keepCapturedPhoto(){
            if(!pendingCapture || captureUploadBusy)return;
            captureUploadBusy=true;
            if(discardCaptureBtn)discardCaptureBtn.disabled=true;
            if(keepCaptureBtn)keepCaptureBtn.disabled=true;
            if(captureFeedback)captureFeedback.classList.add('show');
            if(captureFeedback)captureFeedback.textContent='發文中…';
            const capture=pendingCapture;
            const success=await uploadFiles([capture.file]);
            if(success){
                releasePendingCapture();
                setCaptureReview(false);
                captureUploadBusy=false;
                if(discardCaptureBtn)discardCaptureBtn.disabled=false;
                if(keepCaptureBtn)keepCaptureBtn.disabled=false;
                await resumeCameraPreview();
            }else{
                captureUploadBusy=false;
                if(discardCaptureBtn)discardCaptureBtn.disabled=false;
                if(keepCaptureBtn)keepCaptureBtn.disabled=false;
                if(captureFeedback)captureFeedback.textContent='發文失敗，請重新選擇';
                if(captureFeedback)captureFeedback.classList.add('show');
            }
        }

        if (shutterBtn) shutterBtn.addEventListener('click', e => { e.preventDefault(); captureCameraPhoto(); });
        discardCaptureBtn?.addEventListener('click', discardCapturedPhoto);
        keepCaptureBtn?.addEventListener('click', keepCapturedPhoto);
        document.getElementById('btn_cancel')?.addEventListener('click', () => actionOverlay.classList.remove('show'));
        document.getElementById('btn_camera')?.addEventListener('click', () => document.getElementById('input_camera').click());
        document.getElementById('btn_gallery')?.addEventListener('click', () => document.getElementById('input_gallery').click());
        function handleFileSelect(e) { uploadFiles(e.target.files,e.target); }
        document.getElementById('input_camera')?.addEventListener('change', handleFileSelect);
        document.getElementById('input_gallery')?.addEventListener('change', handleFileSelect);

        // 6. 跨頁面通訊監聽
        channel.onmessage = (event) => {
            if (event.data === 'updated' || event.data?.action === 'updated' || event.data?.type === 'updated') {
                loadLatestPhoto();
                loadUserProfile();
            }
        };

        window.addEventListener('message', event => {
            if (event.data?.type === 'pageVisibility') {
                if(event.data.visible){ prepareCameraView(); loadLatestPhoto(); }
            }
        });

        // 7. 啟動
        window.addEventListener('load', async () => {
            await window.FoodiemoSessionReady;
            initDB().then(() => {
                loadUserProfile();
                loadLatestPhoto();
                if(window.top===window) prepareCameraView();
            });
        });
        window.addEventListener('pagehide', event => {
            // Safari may put index.html in BFCache while edit/search is open.
            // Keep the stream for a BFCache return; only release it on a real unload.
            if(!event.persisted)stopCameraView();
        });
        window.addEventListener('pageshow', event => {
            if(event.persisted && !captureReviewActive)prepareCameraView();
        });
    </script>
</body>
</html>
