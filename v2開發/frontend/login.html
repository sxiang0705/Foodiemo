<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login Screen - Morandi Palette</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#D7BDB0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Foodie">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch((err) => console.log('SW 註冊失敗', err));
            });
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: #E3D5CA;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: fixed;
            width: 100%;
            overflow: hidden;
        }

        .phone-container {
            width: 375px;
            height: 762px;
            background-color: #F5EBE1;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(100, 80, 70, 0.15);
            position: relative;
            padding: 20px 30px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin: 72px 0 42px;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header h1 { font-size: 28px; font-weight: 500; line-height: 1.3; color: #6D5D55; }

        .form-group { display: flex; flex-direction: column; gap: 20px; margin-bottom: 10px; }

        .input-wrapper {
            background-color: #FFFFFF;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid transparent;
            transition: all 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .input-wrapper.error { border: 1px solid #ff4d4d; animation: shake 0.3s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        .input-wrapper i { color: #bfa093; font-size: 22px; }
        .input-wrapper input { border: none; background: transparent; width: 100%; outline: none; font-size: 16px; color: #5c4b45; }

        .forgot-password { text-align: right; margin-top: 15px; margin-bottom: 24px; }
        .forgot-password a { text-decoration: none; color: #a89993; font-size: 13px; font-weight: 500; }

        .login-btn, .google-fallback-btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-btn {
            background-color: #D7BDB0;
            color: white;
            box-shadow: 0 8px 15px rgba(215, 189, 176, 0.4);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #9c8e87;
            font-size: 13px;
            margin: 14px 0 10px;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #D8C9BE;
        }

        #googleLoginMount {
            min-height: 44px;
            display: flex;
            justify-content: center;
        }

        .google-fallback-btn {
            margin-top: 12px;
            background: white;
            color: #5D4D40;
            border: 1px solid #E4D6CB;
            display: none;
        }

        .footer { margin-top: 26px; text-align: center; margin-bottom: 24px; font-size: 13px; color: #9c8e87; }
        .footer a { text-decoration: none; color: #6D5D55; font-weight: bold; }

        @media screen and (max-width: 480px) {
            body { background-color: #F5EBE1; align-items: flex-start; }
            .phone-container {
                width: 100%;
                min-height: 100vh;
                height: auto;
                border-radius: 0;
                box-shadow: none;
                margin: 0;
                padding: 40px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="phone-container">
        <div class="header">
            <h1>Make a memory<br>with us</h1>
        </div>

        <div class="form-group">
            <div class="input-wrapper" id="emailWrapper">
                <i class='bx bx-envelope'></i>
                <input type="email" id="emailInput" placeholder="G-mail" autocomplete="email">
            </div>

            <div class="input-wrapper" id="passwordWrapper">
                <i class='bx bx-lock-alt'></i>
                <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password">
                <i class='bx bx-hide' id="togglePassword" style="cursor: pointer; color: #bfa093;"></i>
            </div>
        </div>

        <div class="forgot-password">
            <a href="forgot-password.html" target="_top">Forgot password?</a>
        </div>

        <button class="login-btn" id="loginBtn">Log in</button>
        <div class="divider">or</div>
        <div id="googleLoginMount"></div>
        <button class="google-fallback-btn" id="googleLoginFallback">使用 Google 登入</button>

        <div class="footer">
            <p>Don't have an account? <a href="signup.html" target="_top">Sign up</a></p>
        </div>
    </div>

    <script src="env.js"></script>
    <script src="google-auth-config.js"></script>
    <script src="config.js"></script>
    <script>
        const API_BASE_URL = DB_CONFIG.apiUrl.replace(/\/$/, '');
        const googleClientId = window.FOOD_END_GOOGLE_CLIENT_ID || '';
        const dbName = DB_CONFIG.name;
        const dbVersion = DB_CONFIG.version;
        let db;

        if (localStorage.getItem('myProfileEmail') && !window.location.search.includes('status=loggedout')) {
            window.top.location.href = 'index.html';
        }

        window.parent.postMessage('lockSwiping', '*');
        window.addEventListener('beforeunload', () => window.parent.postMessage('unlockSwiping', '*'));

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName, dbVersion);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains("user_profile")) db.createObjectStore("user_profile");
                    if (!db.objectStoreNames.contains("posts_timeline")) db.createObjectStore("posts_timeline", { keyPath: "id" });
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function finalizeLogin(data) {
            if (db) db.close();
            await clearLocalAppData();
            localStorage.setItem('myProfileEmail', data.email);
            localStorage.setItem('myProfileName', data.name);
            localStorage.setItem('isPremiumUser', data.is_premium.toString());
            if (data.avatar_url) {
                setStoredAvatarUrl(data.avatar_url);
            } else {
                clearStoredAvatarUrl();
            }

            db = await initDB();
            const tx = db.transaction("user_profile", "readwrite");
            const store = tx.objectStore("user_profile");
            store.put(data.name, "username");
            if (data.avatar_url) store.put(data.avatar_url, "avatar_remote_url");
            tx.oncomplete = () => {
                new BroadcastChannel('memory_update').postMessage('updated');
                window.top.location.href = "index.html";
            };
        }

        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('passwordInput');
        const emailInput = document.getElementById('emailInput');
        const loginBtn = document.getElementById('loginBtn');
        const emailWrapper = document.getElementById('emailWrapper');
        const passwordWrapper = document.getElementById('passwordWrapper');
        const googleFallbackBtn = document.getElementById('googleLoginFallback');

        togglePassword.addEventListener('click', function () {
            const isPw = passwordInput.type === 'password';
            passwordInput.type = isPw ? 'text' : 'password';
            this.classList.toggle('bx-hide', !isPw);
            this.classList.toggle('bx-show', isPw);
        });

        loginBtn.addEventListener('click', async function () {
            const emailValue = emailInput.value.trim();
            const passwordValue = passwordInput.value.trim();

            emailWrapper.classList.remove('error');
            passwordWrapper.classList.remove('error');

            if (!emailValue || !passwordValue) {
                if (!emailValue) emailWrapper.classList.add('error');
                if (!passwordValue) passwordWrapper.classList.add('error');
                return;
            }

            loginBtn.textContent = 'Verifying...';
            loginBtn.disabled = true;

            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailValue, password: passwordValue })
                });
                const data = await response.json();

                if (!response.ok) {
                    if (response.status === 403 && data.detail && data.detail.includes('驗證')) {
                        localStorage.setItem('temp_signup_email', emailValue.toLowerCase());
                        localStorage.setItem('temp_verification_purpose', 'signup');
                        alert('這個帳號還沒完成信箱驗證，系統會帶你去輸入驗證碼。');
                        window.top.location.href = `otp_verify.html?email=${encodeURIComponent(emailValue)}&purpose=signup`;
                        return;
                    }
                    throw new Error(data.detail || 'Login failed.');
                }

                await finalizeLogin(data);
            } catch (error) {
                console.error(error);
                alert(error.message || 'Connection failed.');
                loginBtn.textContent = 'Log in';
                loginBtn.disabled = false;
                emailWrapper.classList.add('error');
                passwordWrapper.classList.add('error');
            }
        });

        async function handleGoogleCredentialResponse(response) {
            try {
                const loginResponse = await fetch(`${API_BASE_URL}/login/google`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });
                const data = await loginResponse.json();
                if (!loginResponse.ok) throw new Error(data.detail || 'Google 登入失敗');
                await finalizeLogin(data);
            } catch (error) {
                console.error(error);
                alert(error.message || 'Google 登入失敗');
            }
        }

        function initGoogleLogin() {
            if (!googleClientId || !window.google || !google.accounts || !google.accounts.id) {
                googleFallbackBtn.style.display = 'block';
                return;
            }

            google.accounts.id.initialize({
                client_id: googleClientId,
                callback: handleGoogleCredentialResponse
            });
            google.accounts.id.renderButton(
                document.getElementById('googleLoginMount'),
                { theme: 'outline', size: 'large', width: 280, text: 'signin_with' }
            );
        }

        googleFallbackBtn.addEventListener('click', () => {
            alert('請先在 frontend/google-auth-config.js 填入 Google Client ID');
        });

        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });

        window.addEventListener('load', () => {
            initDB();
            initGoogleLogin();
        });
    </script>
</body>
</html>
