<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>好友</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html,body{min-height:100%;background:#F3ECE5;color:#59493f}body{padding:0 20px 32px}.header{height:92px;padding-top:34px;display:flex;align-items:center;gap:14px}.back-btn{width:44px;height:44px;border-radius:50%;background:rgba(156,124,102,.16);display:flex;align-items:center;justify-content:center;text-decoration:none}.header h1{font-size:22px;color:#6f5b50}.search-card{background:#fff;border-radius:22px;padding:12px;box-shadow:0 8px 20px rgba(96,73,57,.08);display:flex;gap:8px}.search-card input{min-width:0;flex:1;border:0;outline:0;background:#f7f1ec;border-radius:16px;padding:12px 14px;font-size:15px;color:#59493f}.search-card button,.request-btn{border:0;border-radius:16px;background:#9C7C66;color:#fff;font-weight:700;padding:0 16px;font-size:14px}.hint{color:#9f8d81;font-size:13px;margin:10px 4px 18px;min-height:18px}.section-title{font-size:16px;color:#6f5b50;margin:18px 4px 10px}.list{display:flex;flex-direction:column;gap:10px}.person-card{background:rgba(255,255,255,.8);border-radius:18px;padding:12px;display:flex;align-items:center;gap:11px;min-height:66px}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#9c7c66;flex-shrink:0}.person-copy{min-width:0;flex:1}.person-name{font-weight:700;font-size:14px;color:#59493f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person-email{font-size:12px;color:#a18e82;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.request-btn{height:36px;white-space:nowrap;padding:0 12px}.request-btn[disabled]{background:#d8c8bc;color:#806b5d}.incoming-actions{display:flex;gap:6px;flex-shrink:0}.incoming-actions .request-btn{padding:0 10px}.request-btn.secondary{background:#d8c8bc;color:#6f5b50}.chat-btn{border:0;border-radius:16px;background:#9C7C66;color:#fff;font-weight:700;height:36px;padding:0 13px;font-size:14px;white-space:nowrap}.empty{padding:24px 12px;text-align:center;color:#a18e82;font-size:14px;background:rgba(255,255,255,.45);border-radius:18px}.error{color:#a14d4d}.loading{color:#9f8d81;padding:12px 4px;font-size:14px}
</style>
</head>
<body>
<div class="header"><a href="index.html" target="_top" class="back-btn" onclick="if(closeEmbeddedFeature())return false;" aria-label="返回"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#806B5D" stroke-width="2.5" stroke-linecap="round"><path d="M15 18 9 12l6-6"/></svg></a><h1>好友</h1></div>
<div class="search-card"><input id="friendSearch" type="search" maxlength="80" placeholder="搜尋名稱或 Email" autocomplete="off"><button id="searchBtn" type="button">搜尋</button></div>
<div id="searchHint" class="hint">輸入至少 2 個字搜尋其他使用者</div>
<div id="searchResults" class="list"></div>
<div class="section-title">收到的好友邀請</div><div id="incomingList" class="list"><div class="empty">目前沒有待處理的邀請</div></div>
<div class="section-title">我的好友</div><div id="friendList" class="list"><div class="loading">讀取中…</div></div>
<div class="section-title">已送出的請求</div><div id="outgoingList" class="list"><div class="empty">目前沒有待回覆的請求</div></div>
<script src="env.js"></script><script src="config.js"></script>
<script>
function closeEmbeddedFeature(){try{const feature=window.top.document.getElementById('featureFrame');if(feature&&feature.contentWindow===window){window.top.postMessage({type:'closeFeature'},'*');return true;}}catch(_){}return false;}
window.parent.postMessage('lockSwiping','*');window.addEventListener('beforeunload',()=>window.parent.postMessage('unlockSwiping','*'));
const API_BASE_URL=DB_CONFIG.apiUrl.replace(/\/$/,'');const friendSearch=document.getElementById('friendSearch');const searchBtn=document.getElementById('searchBtn');const searchHint=document.getElementById('searchHint');const searchResults=document.getElementById('searchResults');const incomingList=document.getElementById('incomingList');const friendList=document.getElementById('friendList');const outgoingList=document.getElementById('outgoingList');
function personAvatar(item){return normalizeAvatarUrl(item.avatar_url||window.DEFAULT_AVATAR_URL);}
function statusLabel(status){return status==='accepted'?'已是好友':status==='pending_outgoing'?'已送出':status==='pending_incoming'?'待你批准':'加好友';}
function renderPerson(item,allowRequest=true){const status=item.relationship||'accepted';const disabled=status!=='none';return `<div class="person-card"><img class="avatar" src="${escapeHtml(personAvatar(item))}" alt="" onerror="this.src=window.DEFAULT_AVATAR_URL"><div class="person-copy"><div class="person-name">${escapeHtml(item.name||'未命名使用者')}</div><div class="person-email">${escapeHtml(item.email||'')}</div></div>${allowRequest?`<button class="request-btn" type="button" ${disabled?'disabled':''} data-user-id="${escapeHtml(item.id)}">${statusLabel(status)}</button>`:''}</div>`;}
function renderSearch(items){searchResults.innerHTML=items.length?items.map(item=>renderPerson(item,true)).join(''):'<div class="empty">找不到符合的使用者</div>';searchResults.querySelectorAll('[data-user-id]').forEach(btn=>btn.addEventListener('click',()=>sendRequest(btn.dataset.userId,btn)));}
function openChat(userId){const url='chat.html?friend_id='+encodeURIComponent(userId);if(window.top!==window){window.top.postMessage({type:'openFeature',url},'*');return;}window.location.href=url;}
function renderFriend(item){return `<div class="person-card"><img class="avatar" src="${escapeHtml(personAvatar(item))}" alt="" onerror="this.src=window.DEFAULT_AVATAR_URL"><div class="person-copy"><div class="person-name">${escapeHtml(item.name||'未命名使用者')}</div><div class="person-email">${escapeHtml(item.email||'')}</div></div><button class="chat-btn" type="button" data-chat-id="${escapeHtml(item.id)}">聊天</button></div>`;}
function renderFriends(items){friendList.innerHTML=items.length?items.map(renderFriend).join(''):'<div class="empty">目前還沒有好友</div>';friendList.querySelectorAll('[data-chat-id]').forEach(btn=>btn.addEventListener('click',()=>openChat(btn.dataset.chatId)));}
function renderIncoming(items){incomingList.innerHTML=items.length?items.map(item=>`<div class="person-card"><img class="avatar" src="${escapeHtml(personAvatar(item))}" alt="" onerror="this.src=window.DEFAULT_AVATAR_URL"><div class="person-copy"><div class="person-name">${escapeHtml(item.name||'未命名使用者')}</div><div class="person-email">${escapeHtml(item.email||'')}</div></div><div class="incoming-actions"><button class="request-btn" type="button" data-approve-id="${escapeHtml(item.request_id)}">批准</button><button class="request-btn secondary" type="button" data-reject-id="${escapeHtml(item.request_id)}">忽略</button></div></div>`).join(''):'<div class="empty">目前沒有待處理的邀請</div>';incomingList.querySelectorAll('[data-approve-id]').forEach(btn=>btn.addEventListener('click',()=>respondRequest(btn.dataset.approveId,'approve',btn)));incomingList.querySelectorAll('[data-reject-id]').forEach(btn=>btn.addEventListener('click',()=>respondRequest(btn.dataset.rejectId,'reject',btn)));}
function renderOutgoing(items){outgoingList.innerHTML=items.length?items.map(item=>renderPerson(item,false)).join(''):'<div class="empty">目前沒有待回覆的請求</div>'; }async function loadFriends(){const response=await fetch(API_BASE_URL+'/friends');if(!response.ok)throw new Error('好友資料讀取失敗');const data=await response.json();renderIncoming(data.incoming||[]);renderFriends(data.friends||[]);renderOutgoing(data.outgoing||[]);if((data.incoming||[]).length)searchHint.textContent='你有待批准的好友請求，可直接在上方處理';}
async function runSearch(){const q=friendSearch.value.trim();if(q.length<2){searchResults.innerHTML='';searchHint.textContent='輸入至少 2 個字搜尋其他使用者';return;}searchBtn.disabled=true;searchHint.textContent='搜尋中…';try{const response=await fetch(API_BASE_URL+'/friends/search?q='+encodeURIComponent(q));const data=await response.json();if(!response.ok)throw new Error(data.detail||'搜尋失敗');renderSearch(data.items||[]);searchHint.textContent='搜尋結果';}catch(error){searchResults.innerHTML='<div class="empty error">'+escapeHtml(error.message)+'</div>';searchHint.textContent='';}finally{searchBtn.disabled=false;}}
async function respondRequest(requestId,action,button){button.disabled=true;button.textContent=action==='approve'?'處理中…':'忽略中…';try{const response=await fetch(API_BASE_URL+'/friends/requests/'+encodeURIComponent(requestId)+'/'+action,{method:'POST'});const data=await response.json();if(!response.ok)throw new Error(data.detail||'好友請求處理失敗');await loadFriends();}catch(error){alert(error.message);button.disabled=false;button.textContent=action==='approve'?'批准':'忽略';}}
async function sendRequest(userId,button){button.disabled=true;button.textContent='送出中…';try{const response=await fetch(API_BASE_URL+'/friends/requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:Number(userId)})});const data=await response.json();if(!response.ok)throw new Error(data.detail||'好友請求送出失敗');button.textContent='已送出';await loadFriends();}catch(error){alert(error.message);button.disabled=false;button.textContent='加好友';}}
searchBtn.addEventListener('click',runSearch);friendSearch.addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();runSearch();}});
window.addEventListener('load',async()=>{try{await window.FoodiemoSessionReady;await loadFriends();}catch(error){friendList.innerHTML='<div class="empty error">'+escapeHtml(error.message||'好友資料讀取失敗')+'</div>';}finally{window.signalFoodiemoFeatureReady?.();}});
</script>
</body>
</html>
