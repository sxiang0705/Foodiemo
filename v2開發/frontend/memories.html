<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Memories</title>
    <style>
        /* --- 全局基礎設定 --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #F3ECE5; padding: 24px; color: #8C7B6D; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overscroll-behavior-y: none; position: relative; overflow-y: auto; -webkit-overflow-scrolling: touch;}

        html, body {
            /* 禁止瀏覽器的橡皮筋效果與預設手勢 */
            overscroll-behavior-x: none;
            touch-action: pan-y; /* 只允許上下滑，禁止左右滑 */
        }
        /* 標題區 */
        h1 {
            font-size: 32px; 
            font-weight: 700; 
            color: #8C735D; 
            margin-bottom: 5px; 
            text-align: center; 
            padding-bottom: 8px;
        }

        .subtitle { 
            font-size: 14px; 
            color: #B0A093; 
            margin-bottom: 20px; 
            text-align: center; 
            padding-bottom: 10px;
        }
        
        /* Reset 按鈕 (左上角) - 核彈級 */
        .clear-btn {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            background-color: rgba(255, 255, 255, 0.8); color: #d32f2f; border: 1px solid #d32f2f; 
            padding: 8px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; 
            display: flex; align-items: center; gap: 5px;
        }

        /* 日曆樣式 */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 350px; margin-bottom: 20px; }
        .month-label { font-size: 20px; font-weight: 600; color: #6D5D50; text-align: center; width: 180px; }
        .nav-btn { background: none; border: none; cursor: pointer; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .nav-btn svg { width: 24px; height: 24px; stroke: #8C7B6D; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }

        .page-shell {
            width: 100%;
            min-height: calc(100vh - 48px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            padding: 18px 0;
        }

        .title-group {
            text-align: center;
            margin-bottom: 6px;
        }

        .calendar-container { width: 100%; max-width: 350px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; text-align: center; }
        .weekday { font-size: 13px; font-weight: 600; margin-bottom: 15px; color: #B0A093; }
        .day-cell { aspect-ratio: 1/1; display: flex; justify-content: center; align-items: center; font-size: 16px; font-weight: 500; color: #A69688; position: relative; border-radius: 50%; }
        
        .memory-photo { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 2; border: 2px solid #F3ECE5; box-shadow: 0 4px 8px rgba(0,0,0,0.15); cursor: pointer; }
        .multiple-indicator { position: absolute; width: 100%; height: 100%; border-radius: 50%; background-color: #8C735D; top: 3px; left: 3px; z-index: 1; opacity: 0.3; }
        
        .date-overlay { position: absolute; z-index: 3; color: #fff; font-weight: 700; font-size: 14px; text-shadow: 0 1px 2px rgba(0,0,0,0.6); pointer-events: none; }
        .today-circle { background-color: #8C735D; color: white; width: 100%; height: 100%; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Story Viewer --- */
        .story-image { 
            width: 100%; 
            height: 100%; 
            /* 核心設定：像背景一樣填滿，多出的部分自動裁掉 */
            object-fit: cover; 
            /* 確保人臉或主體盡量在中間 */
            object-position: center; 
            pointer-events: none; 
        }

        .story-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #1a1a1a; /* 稍微帶點灰的黑，比較柔和 */
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.3s ease;
        }

        /* 2. 圖片容器：這裡是消除壓迫感的關鍵 */
        #storyImageDisplay {
            max-height: 85vh;    /* 上下留出足夠空間，不頂天立地 */
            object-fit: contain; /* 完整顯示照片，不裁切 */
        }
        .story-overlay.active { display: flex; opacity: 1; transform: translateY(0); }
        #storyTimeLabel {
            display: none !important;
        }
        #storyOverlay {
            /* 禁止瀏覽器的所有手勢行為（如左右滑動返回），只靠 JS 控制 */
            touch-action: none; 
            /* 確保刪除按鈕層級夠高 */
            z-index: 2000;
        }

        .delete-btn {
            pointer-events: auto !important; /* 確保按鈕一定能點到 */
            cursor: pointer;
        }
        .progress-container { position: absolute; bottom: 30px; left: 10px; right: 10px; height: 3px; display: flex; gap: 5px; z-index: 10000; }
        .bar { flex: 1; height: 100%; background-color: rgba(255, 255, 255, 0.3); border-radius: 2px; overflow: hidden; position: relative; }
        .bar-fill { position: absolute; top: 0; left: 0; height: 100%; width: 0%; background-color: #ffffff; transition: width 0.1s linear; }
        .bar.watched .bar-fill { width: 100%; }

        /* --- 垃圾桶按鈕 (只刪單張) --- */
        .delete-btn {
            position: absolute; 
            top: 60px; right: 25px; 
            z-index: 2147483647; 
            width: 40px; height: 40px; 
            display: flex; justify-content: center; align-items: center;
            background: rgba(0, 0, 0, 0.4); 
            border-radius: 50%; cursor: pointer;
            backdrop-filter: blur(5px); 
            border: 1px solid rgba(255,255,255,0.3);
            pointer-events: auto !important; 
        }
        .delete-btn:active { transform: scale(0.9); background: rgba(200, 0, 0, 0.6); }
        .delete-btn svg { stroke: white; width: 24px; height: 24px; pointer-events: none; }

        /* 隱形觸控區 */
        .tap-area { position: absolute; top: 0; height: 100%; width: 35%; z-index: 1001; }
        .tap-left { left: 0; }
        .tap-right { right: 0; }
        
        #storyOverlay.active {
            /* 當限動開啟時，絕對禁止任何橫向位移 */
            touch-action: none;
        }
    </style>
</head>
<body>

    <button class="clear-btn" onclick="clearAllData()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        RESET APP
    </button>

    <div class="page-shell">
        <div class="title-group">
            <h1>My Memories</h1>
            <div class="subtitle">Keep your moments</div>
        </div>

        <div class="calendar-header">
            <button class="nav-btn" onclick="changeMonth(-1)"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
            <div class="month-label" id="monthLabel">December 2024</div>
            <button class="nav-btn" onclick="changeMonth(1)"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
        </div>

        <div class="calendar-container" id="calendarContainer"></div>
    </div>

    <div id="storyOverlay" class="story-overlay">
        <img id="storyImageDisplay" class="story-image" src="" alt="Story">
        <div id="progressBarContainer" class="progress-container"></div>
        
        <div class="tap-area tap-left" onclick="prevStory(event)"></div>
        <div class="tap-area tap-right" onclick="nextStory(event)"></div>

        <div class="delete-btn" onclick="deleteCurrentStory(event)" ontouchstart="event.stopPropagation()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        </div>
        <button id="storyMenuButton" class="story-menu-btn" type="button" aria-label="貼文選單" aria-expanded="false" onclick="toggleStoryMenu(event)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg>
        </button>
        <div id="storyMenu" class="story-menu" role="menu" aria-hidden="true" onclick="event.stopPropagation()">
            <button type="button" role="menuitem" onclick="removeCurrentMention(event)">取消被標記</button>
            <button type="button" role="menuitem" onclick="reportCurrentMention(event)">檢舉</button>
        </div>
        <div id="storyTimeLabel" style="color: white; font-size: 14px; font-weight: 600; text-shadow: 1px 1px 3px rgba(0,0,0,0.5); padding: 10px;">
        </div>
    </div>

    <script src="env.js"></script>
    <script src="config.js"></script>
    <script>
        // --- 1. 基礎變數與初始化 (對接 config.js) ---
        const dbName = DB_CONFIG.name;
        const dbVersion = DB_CONFIG.version; // 使用 config.js 中的固定版本
        const API_BASE_URL = DB_CONFIG.apiUrl;

        const channel = new BroadcastChannel('memory_update');
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const weekdays = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
        const DURATION = 3000; 

        let db;
        let savedMemories = {};
        let memoryRecords = [];
        let displayDate = new Date();
        let storyList = [], currentIndex = 0, storyTimer;
        let startY = 0, startX = 0, currentY = 0, isDragging = false;

        const overlay = document.getElementById('storyOverlay');

        // Tagged memories use the same compact, animated menu as the social cards.
        const taggedMemoryStyle = document.createElement('style');
        taggedMemoryStyle.textContent = '.story-menu-btn{position:absolute;top:60px;right:78px;z-index:2147483647;width:40px;height:40px;border:1px solid rgba(255,255,255,.3);border-radius:50%;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.4);color:#fff;backdrop-filter:blur(5px);cursor:pointer}.story-menu-btn:active{transform:scale(.92)}.story-menu-btn svg{width:22px;height:22px;fill:currentColor}.story-menu{position:absolute;top:108px;right:24px;z-index:2147483647;display:flex;flex-direction:column;min-width:148px;overflow:hidden;border:1px solid rgba(255,255,255,.2);border-radius:15px;background:rgba(45,35,30,.92);box-shadow:0 10px 28px rgba(0,0,0,.35);opacity:0;transform:translateY(-6px) scale(.94);transform-origin:top right;pointer-events:none;transition:opacity .18s ease,transform .18s ease}.story-menu.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}.story-menu button{padding:12px 16px;border:0;border-bottom:1px solid rgba(255,255,255,.12);background:transparent;color:#fff;text-align:left;font-size:14px;cursor:pointer}.story-menu button:last-child{border-bottom:0}.story-menu button:active{background:rgba(255,255,255,.14)}';
        document.head.appendChild(taggedMemoryStyle);

        const monthlyRecapStyle = document.createElement('style');
        monthlyRecapStyle.textContent = '.monthly-recap-card{width:100%;max-width:350px;min-height:190px;margin:0 auto 18px;border-radius:28px;overflow:hidden;position:relative;color:#fff;background:#9c7c66;box-shadow:0 12px 28px rgba(96,73,57,.16)}.monthly-recap-card::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(47,33,26,.08),rgba(47,33,26,.76))}.monthly-recap-card .recap-cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.monthly-recap-card .recap-copy{position:relative;z-index:1;min-height:190px;padding:22px;display:flex;flex-direction:column;justify-content:flex-end}.monthly-recap-card .recap-kicker{font-size:10px;letter-spacing:.16em;font-weight:800;opacity:.82}.monthly-recap-card h2{margin:4px 0 5px;font-size:25px;line-height:1.05}.monthly-recap-card p{max-width:260px;font-size:13px;line-height:1.45;opacity:.92}.monthly-recap-card .recap-stats{display:flex;gap:12px;margin-top:12px;font-size:11px;opacity:.9}.monthly-recap-card button{align-self:flex-start;margin-top:14px;border:1px solid rgba(255,255,255,.55);border-radius:999px;padding:9px 14px;background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:12px;cursor:pointer;backdrop-filter:blur(8px)}.monthly-recap-card.empty{background:linear-gradient(135deg,#b18b72,#8c735d)}';
        document.head.appendChild(monthlyRecapStyle);

        const monthlyRecapHost = document.createElement('section');
        monthlyRecapHost.id = 'monthlyRecapHost';
        monthlyRecapHost.setAttribute('aria-label', '月回顧');
        document.querySelector('.calendar-header')?.before(monthlyRecapHost);
        monthlyRecapHost.addEventListener('click', (event) => {
            const button = event.target.closest('[data-monthly-recap]');
            if (button) openMonthlyRecap(button.dataset.monthlyRecap);
        });

        // --- 2. 強力攔截左右滑動 (防止 PWA 或行動裝置側滑返回) ---
        window.addEventListener('touchstart', (e) => {
            if (overlay && overlay.classList.contains('active')) {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (overlay && overlay.classList.contains('active')) {
                const moveX = e.touches[0].clientX;
                const moveY = e.touches[0].clientY;
                const diffX = Math.abs(moveX - startX);
                const diffY = Math.abs(moveY - startY);

                // 如果橫移大於縱移，判定為側滑，直接攔截
                if (diffX > diffY && e.cancelable) {
                    e.preventDefault();
                }
            }
        }, { passive: false });

        // --- 3. 資料存取與資料庫 ---
        function initDB() {
            return window.FoodiemoInitDB().then(value => { db = value; return value; });
        }

        channel.onmessage = async function(event) {
            if (event.data === 'updated' || event.data?.action === 'updated' || event.data?.type === 'updated') {
                await loadDataFromDB(); 
            }
        };

        function monthKeyForDate(value) {
            return String(value || '').slice(0, 7);
        }

        function monthLabelForKey(key) {
            const [year, month] = String(key || '').split('-').map(Number);
            if (!year || !month) return '本月';
            return `${monthNames[month - 1]} ${year}`;
        }

        function openMonthlyRecap(monthKey) {
            const url = `monthly-recap.html?month=${encodeURIComponent(monthKey || monthKeyForDate(displayDate.toISOString()))}`;
            if (window.top !== window) window.top.postMessage({type:'openFeature', url}, '*');
            else window.location.href = url;
        }

        function renderMonthlyRecap() {
            if (!monthlyRecapHost) return;
            const monthKey = `${displayDate.getFullYear()}-${String(displayDate.getMonth() + 1).padStart(2, '0')}`;
            const records = memoryRecords.filter(record => monthKeyForDate(record.date || record.timestamp) === monthKey);
            const photos = records.flatMap(record => Array.isArray(record.imageUrls) ? record.imageUrls : (record.url ? [record.url] : []));
            const places = records.map(record => String(record.location || '').trim()).filter(Boolean);
            const image = photos[0] || 'IMG_1940.jpg';
            const label = monthLabelForKey(monthKey);
            const summary = records.length ? `${label}，你留下了 ${records.length} 段值得記住的片段。` : `${label} 還沒有新的記憶，等下一個故事發生。`;
            monthlyRecapHost.innerHTML = `<article class="monthly-recap-card${records.length ? '' : ' empty'}"><img class="recap-cover" src="${escapeHtml(image)}" alt="${escapeHtml(label)}" onerror="this.src='IMG_1940.jpg'"><div class="recap-copy"><span class="recap-kicker">MONTHLY RECAP</span><h2>${escapeHtml(label)}</h2><p>${escapeHtml(summary)}</p><div class="recap-stats"><span>${records.length} 段記憶</span><span>${photos.length} 張照片</span><span>${new Set(places).size} 個地點</span></div><button type="button" data-monthly-recap="${escapeHtml(monthKey)}">查看月回顧 <span aria-hidden="true">→</span></button></div></article>`;
        }

        async function loadDataFromDB() {            const myEmail = localStorage.getItem('myProfileEmail');
            
            // 即使沒有 Email，也要先畫出空白日曆

            if (!myEmail) {
                console.warn("未找到 Email，僅顯示空白日曆");
                memoryRecords = [];
                renderMonthlyRecap();
                return;
            }

            try {
                await loadFoodiemoRecords(result=>{
                // --- 修正點：相容多種後端回傳格式 ---
                let memoriesArray = [];
                if (Array.isArray(result)) {
                    memoriesArray = result;
                } else if (result.status === 'success' && Array.isArray(result.data)) {
                    memoriesArray = result.data;
                } else if (Array.isArray(result.data)) {
                    memoriesArray = result.data;
                }

                memoryRecords = memoriesArray;
                savedMemories = {};
                if (memoriesArray.length > 0) { // 清空舊資料
                    
                    memoriesArray.forEach(record => {
                        // 確保日期存在，且格式為 YYYY-MM-DD
                        const dateKey = record.date; 
                        if (!dateKey) return;

                        if (!savedMemories[dateKey]) savedMemories[dateKey] = [];
                        
                        // 解析多圖或單圖
                        const imgList = record.imageUrls || (record.url ? [record.url] : []);
                        
                        imgList.forEach((url, index) => {
                            savedMemories[dateKey].push({
                                dbId: record.id,
                                url: url,
                                timestamp: (record.timestamp || Date.now()) + index,
                                date: dateKey,
                                isOwner: record.isOwner !== false,
                                isTagged: record.isTagged === true,
                                ownerName: record.username || ''
                            });
                        });
                    });

                    // 排序每一天的照片（由舊到新）
                    for (let key in savedMemories) {
                        savedMemories[key].sort((a, b) => a.timestamp - b.timestamp);
                    }
                    

                    renderCalendar(); // 重新渲染有照片的日曆
                    renderMonthlyRecap();
                } else {
                    renderCalendar();
                    renderMonthlyRecap();
                }
                }, {scope: 'memories'});
            } catch (e) { 
                console.error("❌ 讀取 API 失敗:", e); 
            }
        }
        // --- 4. 日曆渲染 ---
        function renderCalendar() {
            const container = document.getElementById('calendarContainer');
            const label = document.getElementById('monthLabel');
            if (!container || !label) return;
            
            container.innerHTML = '';
            const year = displayDate.getFullYear();
            const month = displayDate.getMonth();
            label.innerText = `${monthNames[month]} ${year}`;

            const grid = document.createElement('div');
            grid.className = 'calendar-grid fade-in';
            
            // 星期標頭
            weekdays.forEach(day => {
                const d = document.createElement('div');
                d.className = 'weekday'; d.innerText = day; grid.appendChild(d);
            });

            const firstDayIndex = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            
            // 填充空白
            for (let i = 0; i < firstDayIndex; i++) grid.appendChild(document.createElement('div'));

            // 填充日期
            for (let d = 1; d <= daysInMonth; d++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                const mStr = String(month + 1).padStart(2, '0');
                const dStr = String(d).padStart(2, '0');
                const dateKey = `${year}-${mStr}-${dStr}`;
                
                if (savedMemories[dateKey] && savedMemories[dateKey].length > 0) {
                    const photos = savedMemories[dateKey];
                    const lastRecord = photos[photos.length - 1]; 
                    
                    if (photos.length > 1) {
                        const ind = document.createElement('div');
                        ind.className = 'multiple-indicator';
                        cell.appendChild(ind);
                    }
                    
                    const img = document.createElement('img');
                    img.src = lastRecord.url;
                    img.className = 'memory-photo';
                    img.onclick = () => openStoryViewer(dateKey);
                    cell.appendChild(img);
                    
                    const num = document.createElement('span');
                    num.className = 'date-overlay'; num.innerText = d;
                    cell.appendChild(num);
                } else {
                    const today = new Date();
                    if (today.getFullYear() === year && today.getMonth() === month && today.getDate() === d) {
                        const c = document.createElement('div');
                        c.className = 'today-circle'; c.innerText = d; cell.appendChild(c);
                    } else { 
                        cell.innerText = d; 
                    }
                }
                grid.appendChild(cell);
            }
            container.appendChild(grid);
        }

        function changeMonth(step) {
            displayDate.setDate(1);
            displayDate.setMonth(displayDate.getMonth() + step);
            FoodiemoViewCache.write("month",displayDate.toISOString());
            renderCalendar();
            renderMonthlyRecap();
        }

        function resetToCurrentMonth() {
            const saved=FoodiemoViewCache.read('month');
            if(saved)displayDate=new Date(saved);
            if(!document.querySelector('#calendarContainer .calendar-grid'))renderCalendar();
        }

        function handleShellVisibility(event) {
            if (event.data && event.data.type === 'pageVisibility' && event.data.visible) {
                resetToCurrentMonth();
            }
        }

        // --- 5. IG Story 系統 ---
        function openStoryViewer(clickedDateKey) {
            storyList = [];
            let foundStartIndex = -1;
            const sortedKeys = Object.keys(savedMemories).sort((a, b) => new Date(a) - new Date(b));

            sortedKeys.forEach(key => {
                savedMemories[key].forEach(record => {
                    if (foundStartIndex === -1 && key === clickedDateKey) {
                        foundStartIndex = storyList.length;
                    }
                    storyList.push({ ...record });
                });
            });

            currentIndex = foundStartIndex !== -1 ? foundStartIndex : 0;

            if (overlay && storyList.length > 0) {
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden'; 
                window.parent.postMessage('lockSwiping', '*'); // 通知父頁面
                renderStory();
            }
        }

        function renderStory() {
            if (currentIndex < 0 || currentIndex >= storyList.length) return;
            
            const currentItem = storyList[currentIndex];
            const menuButton = document.getElementById('storyMenuButton');
            const menu = document.getElementById('storyMenu');
            const deleteButton = document.querySelector('.delete-btn');
            const tagged = currentItem.isTagged === true && currentItem.isOwner !== true;
            if (menuButton) {
                menuButton.style.display = tagged ? 'flex' : 'none';
                menuButton.setAttribute('aria-expanded', 'false');
            }
            if (menu) {
                menu.classList.remove('show');
                menu.setAttribute('aria-hidden', 'true');
            }
            if (deleteButton) deleteButton.style.display = currentItem.isOwner === true ? 'flex' : 'none';
            const displayImg = document.getElementById('storyImageDisplay');
            if (displayImg) displayImg.src = currentItem.url;

            const sameDay = storyList.filter(s => s.date === currentItem.date);
            const idxInDay = sameDay.findIndex(s => s.url === currentItem.url && s.timestamp === currentItem.timestamp);
            const barContainer = document.getElementById('progressBarContainer');
            
            if (barContainer) {
                barContainer.innerHTML = '';
                sameDay.forEach((s, i) => {
                    const bar = document.createElement('div');
                    bar.className = 'bar ' + (i < idxInDay ? 'watched' : '');
                    const fill = document.createElement('div');
                    fill.className = 'bar-fill';
                    bar.appendChild(fill);
                    barContainer.appendChild(bar);
                    
                    if (i === idxInDay) {
                        setTimeout(() => {
                            fill.style.width = '100%';
                            fill.style.transition = `width ${DURATION}ms linear`;
                        }, 10);
                    } else if (i < idxInDay) { 
                        fill.style.width = '100%'; 
                    }
                });
            }

            clearTimeout(storyTimer);
            storyTimer = setTimeout(() => nextStory(), DURATION);
        }

        function nextStory(e) { 
            if(e) e.stopPropagation(); 
            if (currentIndex < storyList.length - 1) { 
                currentIndex++; 
                renderStory(); 
            } else { 
                closeStory(); 
            } 
        }

        function prevStory(e) { 
            if(e) e.stopPropagation(); 
            if (currentIndex > 0) { 
                currentIndex--; 
                renderStory(); 
            } 
        }

        function closeStory() { 
            clearTimeout(storyTimer); 
            if (overlay) {
                overlay.classList.remove('active'); 
                overlay.style.transform = 'translateY(0)';
                overlay.style.opacity = '1';
            }
            document.body.style.overflow = ''; 
            window.parent.postMessage('unlockSwiping', '*');
        }

        function toggleStoryMenu(e) {
            if (e) { e.stopPropagation(); e.preventDefault(); }
            const item = storyList[currentIndex];
            const menuButton = document.getElementById('storyMenuButton');
            const menu = document.getElementById('storyMenu');
            if (!item || !item.isTagged || item.isOwner || !menu || !menuButton) return;
            const open = !menu.classList.contains('show');
            menu.classList.toggle('show', open);
            menu.setAttribute('aria-hidden', open ? 'false' : 'true');
            menuButton.setAttribute('aria-expanded', open ? 'true' : 'false');
        }

        function closeStoryMenu() {
            const menu = document.getElementById('storyMenu');
            const menuButton = document.getElementById('storyMenuButton');
            menu?.classList.remove('show');
            menu?.setAttribute('aria-hidden', 'true');
            menuButton?.setAttribute('aria-expanded', 'false');
        }

        async function removeCurrentMention(e) {
            if (e) { e.stopPropagation(); e.preventDefault(); }
            const currentItem = storyList[currentIndex];
            if (!currentItem?.isTagged || currentItem.isOwner || !currentItem.dbId) return;
            closeStoryMenu();
            if (!confirm('取消後，你將不再在這則貼文的標記名單中。確定要取消嗎？')) return;
            try {
                const response = await fetch(API_BASE_URL + '/posts/' + encodeURIComponent(currentItem.dbId) + '/mention', {method: 'DELETE'});
                if (!response.ok) {
                    const detail = await response.json().catch(() => ({}));
                    throw new Error(detail.detail || '取消標記失敗');
                }
                FoodiemoViewCache.remove('memories-records');
                channel.postMessage('updated');
                closeStory();
                await loadDataFromDB();
            } catch (error) {
                alert(error.message || '取消標記失敗，請稍後再試');
            }
        }

        function reportCurrentMention(e) {
            if (e) { e.stopPropagation(); e.preventDefault(); }
            closeStoryMenu();
            alert('已送出檢舉，管理功能將在後續版本接入。');
        }

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#storyMenu') && !e.target.closest('#storyMenuButton')) closeStoryMenu();
        });

        // --- 6. 刪除邏輯 ---
        async function deleteCurrentStory(e) {
            if (e) { e.stopPropagation(); e.preventDefault(); }
            const currentItem = storyList[currentIndex];
            if (!currentItem || !currentItem.dbId) return;
            if (currentItem.isTagged && !currentItem.isOwner) {
                alert("這是被標記的貼文，請使用右上角選單取消標記或檢舉。");
                return;
            }

            if (!confirm("確定要刪除這張照片嗎？")) return;

            // --- 修改處：從 localStorage 獲取 email ---
            const myEmail = localStorage.getItem('myProfileEmail'); 
            if (!myEmail) {
                alert("登入資訊已過期，請重新登入");
                return;
            }

            try {
                // --- 修改處：URL 加入 &email= 參數 ---
                const url = `${API_BASE_URL}/delete_single_photo?post_id=${currentItem.dbId}&photo_url=${encodeURIComponent(currentItem.url)}&email=${encodeURIComponent(myEmail)}`;
                
                const response = await fetch(url, { method: 'DELETE' });

                if (response.ok) {
                    channel.postMessage('updated'); 
                    
                    // 以下邏輯保持不變...
                    const dateKey = currentItem.date;
                    savedMemories[dateKey] = savedMemories[dateKey].filter(item => item.url !== currentItem.url);
                    storyList.splice(currentIndex, 1);
                    
                    if (storyList.length === 0) {
                        closeStory();
                    } else {
                        if (currentIndex >= storyList.length) currentIndex = storyList.length - 1;
                        renderStory();
                    }
                    renderCalendar();
                } else {
                    const errData = await response.json();
                    alert("刪除失敗: " + (errData.detail || "未知錯誤"));
                }
            } catch (err) {
                alert("連線失敗，請檢查網路");
            }
        }

        // --- 7. 下拉關閉效果 ---
        overlay.addEventListener('touchstart', (e) => { 
            if(e.target.closest('.delete-btn') || e.target.closest('.story-menu-btn') || e.target.closest('.story-menu') || e.target.closest('.story-nav')) return;
            startY = e.touches[0].clientY; 
            isDragging = false; 
            overlay.style.transition = 'none'; 
        }, { passive: false });
        
        overlay.addEventListener('touchmove', (e) => { 
    if(e.target.closest('.delete-btn') || e.target.closest('.story-menu-btn') || e.target.closest('.story-menu') || e.target.closest('.story-nav')) return;
    
    currentY = e.touches[0].clientY; 
    const diffY = currentY - startY;

            // 修正點：增加 10 像素的緩衝區，防止極輕微的抖動觸發拖拽
            if (diffY > 10) { 
                isDragging = true; 
                if (e.cancelable) e.preventDefault(); 
                overlay.style.transform = `translateY(${diffY}px)`; 
                overlay.style.opacity = 1 - (diffY / 600); 
            } 
        }, { passive: false });

        overlay.addEventListener('touchend', () => {
            if (!isDragging) return;
            overlay.style.transition = '0.3s ease-out';
            if (currentY - startY > 150) { 
                closeStory(); 
            } else { 
                overlay.style.transform = 'translateY(0)'; 
                overlay.style.opacity = '1'; 
            }
            isDragging = false;
        });

        async function clearAllData() {
            if(confirm("這將清除所有緩存並登出，確定嗎？")) {
                await fetch(`${API_BASE_URL}/logout`, { method: 'POST' }).catch(() => null);
                await clearLocalAppData();
                alert("App 已重置");
                window.top.location.href = "login.html";
            }
        }

        window.addEventListener('pageshow', resetToCurrentMonth);
        window.addEventListener('focus', resetToCurrentMonth);
        window.addEventListener('message', handleShellVisibility);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                resetToCurrentMonth();
            }
        });

        // --- 初始化執行 ---
        (async () => {
            try {
                await initDB();
                await window.FoodiemoSessionReady;
                resetToCurrentMonth();
                await loadDataFromDB();
            } catch (error) {
                console.error('回憶頁初始化失敗', error);
            } finally {
                window.signalFoodiemoFrameReady?.(0);
            }
        })();
    </script>
</body>
</html>
